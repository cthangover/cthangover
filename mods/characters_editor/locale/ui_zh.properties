mod_characters_editor_name = 角色编辑器
mod_characters_editor_desc = 游戏角色的编辑器——英雄、NPC 和敌人：带搜索和立绘的列表，模组每种语言的名称，立绘、RPG 地图行走图、战斗属性和行动；保存后游戏中立即可见。
tools/characters_editor/title = 角色
tools/characters_editor/name = 名称
tools/characters_editor/image = 立绘
tools/characters_editor/image_tip = 模组 characters/ 文件夹中的图片：对话、战斗和角色面板会显示它
tools/characters_editor/charset = 行走图（RPG）
tools/characters_editor/charset_tip = 角色在 RPG 地图上的样子：charsets/ 文件夹中 3×4 帧的图集。小说不需要
tools/characters_editor/level = 等级
tools/characters_editor/health = 生命
tools/characters_editor/attack = 攻击
tools/characters_editor/defence = 防御
tools/characters_editor/point = 行动点
tools/characters_editor/point_tip = 战斗中用于行动的点数
tools/characters_editor/exp = 经验
tools/characters_editor/exp_tip = 角色的经验值，由战斗核心读取
tools/characters_editor/recruitment = 招募几率
tools/characters_editor/recruitment_tip = 把被击败的角色收入队伍的几率（百分比）；0——永不
tools/characters_editor/behaviour = 行为
tools/characters_editor/behaviour_tip = 由游戏控制时角色在战斗中的行动方式；base——常规
tools/characters_editor/actions = 行动
tools/characters_editor/actions_tip = 来自已加载模组的角色战斗行动
