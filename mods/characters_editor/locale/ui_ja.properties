mod_characters_editor_name = キャラクターエディター
mod_characters_editor_desc = ゲームのキャラクター——主人公、NPC、敵——のエディター：検索と肖像付きの一覧、MOD の各言語での名前、肖像、RPG マップのキャラチップ、戦闘能力値とアクション。保存するとすぐにゲームに反映されます。
