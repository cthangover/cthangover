mod_characters_editor_name = 캐릭터 에디터
mod_characters_editor_desc = 게임 캐릭터 — 영웅, NPC, 적 — 에디터: 검색과 초상화가 있는 목록, 모드의 모든 언어로 된 이름, 초상화, RPG 맵 캐릭터 시트, 전투 능력치와 액션. 저장하면 게임에 바로 보입니다.
tools/characters_editor/title = 캐릭터
tools/characters_editor/name = 이름
tools/characters_editor/image = 초상화
tools/characters_editor/image_tip = 모드의 characters/ 폴더에 있는 그림. 대화, 전투, 캐릭터 패널에 표시된다
tools/characters_editor/charset = 캐릭터 시트 (RPG)
tools/characters_editor/charset_tip = RPG 맵에서 캐릭터가 보이는 모습: charsets/ 폴더의 3×4 프레임 시트. 노벨에는 필요 없다
tools/characters_editor/level = 레벨
tools/characters_editor/health = 체력
tools/characters_editor/attack = 공격
tools/characters_editor/defence = 방어
tools/characters_editor/point = 행동 포인트
tools/characters_editor/point_tip = 전투에서 액션에 쓰는 포인트
tools/characters_editor/exp = 경험치
tools/characters_editor/exp_tip = 캐릭터의 경험치. 전투 코어가 읽는다
tools/characters_editor/recruitment = 영입 확률
tools/characters_editor/recruitment_tip = 쓰러뜨린 캐릭터를 파티에 들일 확률(퍼센트). 0 — 불가
tools/characters_editor/behaviour = 행동 방식
tools/characters_editor/behaviour_tip = 게임이 조종할 때 전투에서의 행동 방식. base — 기본
tools/characters_editor/actions = 액션
tools/characters_editor/actions_tip = 불러온 모드에 있는 캐릭터의 전투 액션
