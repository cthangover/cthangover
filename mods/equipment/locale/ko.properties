mod_equipment_name = 장비
mod_equipment_desc = 능력치가 있는 모든 게임을 위한 장비: 데이터로 정의하는 슬롯(무기, 방어구, 장신구 — 노벨이라면 의상과 액세서리). 아이템은 자기 JSON의 키 두 개(“Equip” — 종류, “Traits” — 착용 중 주는 효과)만으로 장비가 됩니다. 착용한 것이 능력치에 반영되므로 전투, 판정, 조건이 바로 바뀝니다. 인벤토리의 평소 대상 선택으로 착용, 액션 equip.put과 equip.remove, 조건 equipped(누가, 아이템).
equipment/verb_equip = 장착
equipment/not_gear = 이것은 착용할 수 없습니다.
equipment/no_slot = 이것을 착용할 슬롯이 없습니다.
equipment/wrong_archetype = 손에 맞지 않습니다: 다른 직업용입니다.
equipment/sheet/title = 장비
equipment/sheet/hint = 착용하려면 가방에서 골라 ‘장착’을 누르세요.
equipment/sheet/take_off = 벗기
equipment/schema/equip/put = 착용
equipment/schema/equip/put_desc = 직업의 시작 장비, 바로 착용하는 선물
equipment/schema/field/item = 아이템
equipment/schema/field/who = 누구
equipment/schema/field/slot = 슬롯
equipment/schema/field/give = 지급
equipment/schema/equip/give_desc = 가방에 없어도 지급
equipment/schema/equip/remove = 벗기
equipment/schema/equip/remove_desc = 착용한 물건이 가방으로 돌아감
equipment/schema/kind/equip_slot = 장비 슬롯
equipment/schema/kind/equip_slot_desc = 캐릭터가 물건을 착용하는 곳
equipment/schema/field/name = 이름
equipment/schema/field/order = 순서
equipment/schema/field/accepts = 허용 종류
equipment/schema/field/accepts_desc = 장비 종류(쉼표로 구분). 비우면 슬롯 id가 종류
equipment/schema/field/equip = 장비 종류
equipment/schema/field/equip_desc = sword, staff, armor… — 어느 슬롯에 맞는지. 비우면 장비 아님
equipment/schema/field/traits = 특성
equipment/schema/field/traits_desc = 능력치 수정: 고정값, 퍼센트 또는 공식
equipment/schema/field/stat = 능력치
equipment/schema/field/add = 더하기
equipment/schema/field/percent = 퍼센트
equipment/schema/field/formula = 공식
equipment/schema/field/archetypes = 허용 원형
equipment/schema/field/archetypes_desc = 비우면 누구나 착용
equipment/schema/field/stat_up = 영구 상승
equipment/schema/field/stat_up_desc = action/stat_up 행동용: 능력치 → 양
