mod_equipment_name = 装備
mod_equipment_desc = ステータスのあるどのゲームにも使える装備：スロットはデータ（武器、防具、アクセサリー——ノベルなら服装や装身具）。アイテムは自分の JSON の二つのキー（「Equip」——種類、「Traits」——装備中に与えるもの）だけで装備品になる。装備はステータスに反映されるので、バトル、判定、条件がすぐに変わる。インベントリのいつもの対象選択で装備。アクション equip.put と equip.remove、条件 equipped(誰, アイテム)。
equipment/verb_equip = 装備する
equipment/not_gear = これは装備できない。
equipment/no_slot = これを付ける場所がない。
equipment/wrong_archetype = 手に合わない：別の職業向けだ。
equipment/sheet/title = 装備
equipment/sheet/hint = 装備するには、かばんで選んで「装備する」を押す。
equipment/sheet/take_off = 外す
equipment/schema/equip/put = 装備する
equipment/schema/equip/put_desc = 職業の初期装備、すぐに身に着ける贈り物
equipment/schema/field/item = アイテム
equipment/schema/field/who = 誰
equipment/schema/field/slot = スロット
equipment/schema/field/give = 付与
equipment/schema/equip/give_desc = かばんになくても付与する
equipment/schema/equip/remove = 外す
equipment/schema/equip/remove_desc = 外した物はかばんに戻る
equipment/schema/kind/equip_slot = 装備スロット
equipment/schema/kind/equip_slot_desc = キャラクターが物を身に着ける場所
equipment/schema/field/name = 名前
equipment/schema/field/order = 順序
equipment/schema/field/accepts = 受け付ける種類
equipment/schema/field/accepts_desc = 装備の種類（カンマ区切り）。空ならスロット id が種類
equipment/schema/field/equip = 装備の種類
equipment/schema/field/equip_desc = sword、staff、armor…——どのスロットに入るか。空なら装備ではない
equipment/schema/field/traits = 特性
equipment/schema/field/traits_desc = ステータス修正：固定値、パーセント、または式
equipment/schema/field/stat = ステータス
equipment/schema/field/add = 加算
equipment/schema/field/percent = パーセント
equipment/schema/field/formula = 式
equipment/schema/field/archetypes = 対象アーキタイプ
equipment/schema/field/archetypes_desc = 空なら誰でも装備できる
equipment/schema/field/stat_up = 永続的に上げる
equipment/schema/field/stat_up_desc = action/stat_up 用：ステータス → 量
