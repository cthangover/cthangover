mod_equipment_name = 装备
mod_equipment_desc = 适用于任何有属性的游戏的装备：栏位即数据（武器、护甲、饰品——或小说里的服装和首饰）；物品只需自身 JSON 中的两个键就成为装备（“Equip”——类型，“Traits”——穿戴时提供什么）。穿戴的物品会影响属性，因此战斗、检定和条件立即随之改变。通过背包常用的目标选择来穿戴；动作 equip.put 和 equip.remove；条件 equipped(谁, 物品)。
equipment/verb_equip = 装备
equipment/not_gear = 这个无法穿戴。
equipment/no_slot = 没有可放它的栏位。
equipment/wrong_archetype = 不合手：这是给别的职业用的。
equipment/sheet/title = 装备
equipment/sheet/hint = 要穿戴物品，打开背包，选中它并点击“装备”。
equipment/sheet/take_off = 卸下
equipment/schema/equip/put = 穿戴
equipment/schema/equip/put_desc = 职业的初始装备、立刻穿上的礼物
equipment/schema/field/item = 物品
equipment/schema/field/who = 谁
equipment/schema/field/slot = 栏位
equipment/schema/field/give = 直接给予
equipment/schema/equip/give_desc = 即使背包里没有也给予
equipment/schema/equip/remove = 卸下
equipment/schema/equip/remove_desc = 卸下的物品回到背包
equipment/schema/kind/equip_slot = 装备栏位
equipment/schema/kind/equip_slot_desc = 角色穿戴物品的位置
equipment/schema/field/name = 名称
equipment/schema/field/order = 顺序
equipment/schema/field/accepts = 接受类型
equipment/schema/field/accepts_desc = 装备类型，逗号分隔；留空——类型即栏位 id
equipment/schema/field/equip = 装备类型
equipment/schema/field/equip_desc = sword、staff、armor…——放进哪个栏位；留空——不是装备
equipment/schema/field/traits = 特性
equipment/schema/field/traits_desc = 属性修正：固定值、百分比或公式
equipment/schema/field/stat = 属性
equipment/schema/field/add = 加值
equipment/schema/field/percent = 百分比
equipment/schema/field/formula = 公式
equipment/schema/field/archetypes = 仅限原型
equipment/schema/field/archetypes_desc = 留空——任何人都能穿戴
equipment/schema/field/stat_up = 永久提升
equipment/schema/field/stat_up_desc = 用于 action/stat_up 动作：属性 → 数量
