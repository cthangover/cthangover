mod_stat_checks_name = Stat Checks
mod_stat_checks_desc = Stat checks in any scenario: “check cha 12 -> :success” rolls a stat plus dice against a difficulty, shows the outcome line and branches the story — talking a guard round in a novel, forcing a door in an RPG. The roll stays in dialog variables for lines of your own. Dice default to the game setting checks.dice, else d20; dice=none makes a plain threshold.
checks/line = [${check_stat}: ${check_total} vs ${check_dc}] ${check_result}
checks/success = Success
checks/failure = Failure
checks/schema/checks/check = Stat check
checks/schema/checks/check_desc = Stat + dice + bonus against a difficulty: a line with the outcome and a jump
checks/schema/checks/arrow_success = On success, go to
checks/schema/field/stat = Stat
checks/schema/field/difficulty = Difficulty
checks/schema/field/who = Who
checks/schema/field/dice = Dice
checks/schema/checks/dice_desc = d20, 2d6, none — without dice the check is a threshold
checks/schema/field/bonus = Bonus
checks/schema/field/else = Else label
checks/schema/field/quiet = Quiet
checks/schema/checks/quiet_desc = Do not show the roll line
