mod_stat_checks_name = 属性检定
mod_stat_checks_desc = 任何剧本中的属性检定：“check cha 12 -> :成功”用属性加骰子对抗难度，显示结果行并让故事分支——在小说里说服守卫，在 RPG 里撬开门。掷骰结果留在对话变量里，供你自己的台词使用。骰子默认取游戏设置 checks.dice，否则为 d20；dice=none 即简单门槛。
checks/line = [${check_stat}：${check_total} 对 ${check_dc}] ${check_result}
checks/success = 成功
checks/failure = 失败
checks/schema/checks/check = 属性检定
checks/schema/checks/check_desc = 属性 + 骰子 + 加成对抗难度：显示结果并跳转
checks/schema/checks/arrow_success = 成功时跳转
checks/schema/field/stat = 属性
checks/schema/field/difficulty = 难度
checks/schema/field/who = 谁
checks/schema/field/dice = 骰子
checks/schema/checks/dice_desc = d20、2d6、none——没有骰子时检定就是门槛
checks/schema/field/bonus = 加成
checks/schema/field/else = 否则跳转
checks/schema/field/quiet = 不显示结果
checks/schema/checks/quiet_desc = 不显示掷骰行
