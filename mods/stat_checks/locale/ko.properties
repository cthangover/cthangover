mod_stat_checks_name = 능력치 판정
mod_stat_checks_desc = 모든 시나리오에서 쓰는 능력치 판정: “check cha 12 -> :성공”은 능력치와 주사위를 난이도와 겨루고, 결과 줄을 보여 주며 이야기를 갈래로 나눕니다 — 노벨에서 경비병 설득, RPG에서 문 부수기. 굴림 결과는 대화 변수에 남아 직접 쓴 줄에 쓸 수 있습니다. 주사위 기본값은 게임 설정 checks.dice, 없으면 d20. dice=none은 단순 기준값.
checks/line = [${check_stat}: ${check_total} 대 ${check_dc}] ${check_result}
checks/success = 성공
checks/failure = 실패
checks/schema/checks/check = 능력치 판정
checks/schema/checks/check_desc = 능력치 + 주사위 + 보너스 대 난이도: 결과 줄과 이동
checks/schema/checks/arrow_success = 성공 시 이동
checks/schema/field/stat = 능력치
checks/schema/field/difficulty = 난이도
checks/schema/field/who = 누구
checks/schema/field/dice = 주사위
checks/schema/checks/dice_desc = d20, 2d6, none — 주사위가 없으면 판정은 기준값
checks/schema/field/bonus = 보너스
checks/schema/field/else = 아니면 라벨
checks/schema/field/quiet = 결과 숨김
checks/schema/checks/quiet_desc = 굴림 줄을 표시하지 않음
