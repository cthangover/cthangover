mod_stat_checks_name = 能力値判定
mod_stat_checks_desc = どのシナリオでも使える能力値判定：「check cha 12 -> :成功」はステータスとダイスを難易度と比べ、結果の行を出して物語を分岐させる——ノベルで門番を説得し、RPG で扉をこじ開ける。出目は会話変数に残り、自分の行で使える。ダイスの既定はゲーム設定 checks.dice、なければ d20。dice=none なら単純なしきい値。
checks/line = [${check_stat}：${check_total} 対 ${check_dc}] ${check_result}
checks/success = 成功
checks/failure = 失敗
checks/schema/checks/check = 能力値判定
checks/schema/checks/check_desc = ステータス + ダイス + ボーナス 対 難易度：結果の行とジャンプ
checks/schema/checks/arrow_success = 成功時のラベル
checks/schema/field/stat = ステータス
checks/schema/field/difficulty = 難易度
checks/schema/field/who = 誰
checks/schema/field/dice = ダイス
checks/schema/checks/dice_desc = d20、2d6、none——ダイスなしなら判定はしきい値
checks/schema/field/bonus = ボーナス
checks/schema/field/else = それ以外のラベル
checks/schema/field/quiet = 結果を表示しない
checks/schema/checks/quiet_desc = ダイスの行を表示しない
