mod_rpg_editor_name = RPG 地图编辑器
mod_rpg_editor_desc = RPG 世界的瓦片地图编辑器：三层瓦片、碰撞层和地图事件，支持撤销，并在运行中的游戏里实时预览。
tools/rpg_editor/title = RPG 地图编辑器
tools/rpg_editor/hint = 左键——绘制 · 右键——擦除 · Alt+左键——吸取瓦片 · 事件：点击——选择/拖动，双击——添加，Del——删除 · 1–5 切换图层 · B/E/G 画笔 · 滚轮/Shift+滚轮、中键拖动——滚动 · Ctrl+滚轮缩放 · Ctrl+Z/Y · Ctrl+S
