rpg_plus/prologue/title = 十字路
rpg_plus/prologue/line1 = 道標は正直に三方向を同時に指している。どれにも行きたくない。
rpg_plus/prologue/line2 = 下には灰色の森のそばの村。狼を恐れない者が要るという。恐れていても、黙っていればいい。財布で鳴る硬貨二十五枚——前の人生の残りのすべて。
rpg_plus/prologue/ask = ここに来る前、お前は何者だった？
rpg_plus/prologue/opt_warrior = 兵士だ。剣は単純だ。
rpg_plus/prologue/opt_mage = 魔法使いの弟子だ。炎は言うことを聞く。
rpg_plus/prologue/opt_rogue = 流れ者だ。誰とでも話はつけられる。
rpg_plus/prologue/warrior = 背中の木の剣が兵舎に残してもらえたすべて。それと先に殴る癖。
rpg_plus/prologue/mage = 杖は温かく、水晶が唸る。師は、炎は賢い者に従うと言った。残りの者については言いそびれた。
rpg_plus/prologue/rogue = 袖に短剣、笑顔はいつでも。扉は笑顔で開く。開かない扉は短剣で。
rpg_plus/prologue/seer = 道標のそばに薄紫の外套の旅人が座っている。結末をもう知っていて、先に退屈しているような目つきだ。
rpg_plus/prologue/seer_ask = 彼女に何と言う？
rpg_plus/prologue/opt_ask_way = 丁寧に道を尋ねる［カリスマ 10］
rpg_plus/prologue/opt_pass = 黙って通り過ぎる
rpg_plus/prologue/gift = 「礼儀正しいね。珍しい」彼女はクローバーのお守りを放ってよこす。「持ってな。運は尋ねる者を好む。長続きはしないけどね」
rpg_plus/prologue/snub = 「自分で見つけな」彼女はそっぽを向く。「みんな見つける。生きたまま見つける者もいる」
rpg_plus/prologue/path = 小道は村へ下っていく。霧はしぶしぶ晴れる。どこへ行くのか知っているかのように。
rpg_plus/prologue/mage_hint = 杖が小さく火花を弾く。狼は火が嫌いだという。杖のほうも狼が嫌いらしい。
rpg_plus/prologue/sheet_hint = 自分のシートは上のバーの本のボタン：ステータス、レベル、装備。装備はかばんから身に着ける。
rpg_plus/yard/intro = 「さて」師匠は腕を組む。「見せてみろ。死ぬなよ、責任は取らん」
rpg_plus/yard/ask = 何をする？
rpg_plus/yard/opt_drill = 打ち込み稽古（経験値 +20、一度だけ）
rpg_plus/yard/opt_log = 丸太を頭上に持ち上げる［筋力 12］
rpg_plus/yard/opt_back = 村へ戻る
rpg_plus/yard/drill_done = 「悪くない。あと百回やれば戦士に見えるさ。遠目にはな」
rpg_plus/yard/drilled = 「今日はここまで。筋肉は寝ている間に育つ。寝ろ」
rpg_plus/yard/log_ok = 「はっ！持ち上げたな」師匠が小瓶を放る。「力の強壮剤だ。礼はいらん。空きっ腹で飲むなよ」
rpg_plus/yard/log_again = 「また？見栄っ張りめ。強壮剤はもうない。敬意ならある。少しな」
rpg_plus/yard/log_fail = 「丸太の勝ちだ。よくある。もう少し育つか、商人から力の強壮剤を買え。効くらしい。商人が言うには」
rpg_plus/trainer/hello = 「新入りか？手を見せろ。ほう……鍛えられなくはない。本気でやればな」
rpg_plus/trainer/veteran = 「たくましくなったな。レベル三か。そのうち俺に教え始めるんだろう。やめろ」
rpg_plus/trainer/opt_yard = 稽古場へ行く
rpg_plus/trainer/opt_later = 今はいい
rpg_plus/trainer/bye = 「手がうずいたら来い。狼に食われたら来なくていい」
rpg_plus/seer/hello = 「この先を知りたいかい？手をお出し。そっちじゃない——盗みに使わないほうの手だよ」
rpg_plus/seer/fortune = 「洞窟の狼は鋼より火を恐れる。それと盾のないところを打ちな。ここまでは無料。残りは有料だよ」
rpg_plus/seer/charm = 「それとお守りを見つけな。運は空の手にはしがみつかない。満ちた手にも長くはね」
rpg_plus/seer/fog = 「霧……何も見えない。お前に未来がないか、今日の星の機嫌が悪いか。明日おいで。明日があればね」
rpg_plus/chest/closed = 宝箱に鍵はない。持ち主はお人好しか、中身が希望だけか。
rpg_plus/chest/coins = 硬貨が十枚。持ち主はお人好しだった。過去形で。
rpg_plus/chest/empty = 空っぽだ。信頼は硬貨と一緒に尽きた。
rpg_plus/slime/pet = 飼いならされたスライム。誰かが手から餌をやっている。手はまだ無事だ。
