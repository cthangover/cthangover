rpg_plus/prologue/title = 갈림길
rpg_plus/prologue/line1 = 이정표는 정직하게 세 방향을 한꺼번에 가리킨다. 어디로도 가고 싶지 않다.
rpg_plus/prologue/line2 = 아래에는 회색 숲 곁의 마을이 있다. 늑대를 두려워하지 않는 누군가가 필요하단다. 아니면 두려워하되 조용히. 지갑에서 동전 스물다섯 닢이 짤랑인다 — 지난 삶에서 남은 전부.
rpg_plus/prologue/ask = 여기 오기 전, 너는 누구였지?
rpg_plus/prologue/opt_warrior = 병사. 검은 단순하지.
rpg_plus/prologue/opt_mage = 마법사의 제자. 불이 내 말을 듣지.
rpg_plus/prologue/opt_rogue = 떠돌이. 누구와도 말은 통하지.
rpg_plus/prologue/warrior = 등에 멘 나무 검이 병영이 남겨 준 전부다. 먼저 치는 버릇과 함께.
rpg_plus/prologue/mage = 지팡이는 따뜻하고 수정이 웅웅댄다. 스승은 불이 영리한 자의 말을 듣는다고 했다. 나머지에 대해서는 말할 틈이 없었다.
rpg_plus/prologue/rogue = 소매엔 단검, 미소는 언제든. 문은 미소에 열린다. 안 열리는 문은 단검에.
rpg_plus/prologue/seer = 이정표 옆에 연보랏빛 망토의 나그네가 앉아 있다. 결말을 이미 알고, 미리 지루해하는 눈빛이다.
rpg_plus/prologue/seer_ask = 그녀에게 뭐라고 할까?
rpg_plus/prologue/opt_ask_way = 정중하게 길을 묻는다 [매력 10]
rpg_plus/prologue/opt_pass = 말없이 지나친다
rpg_plus/prologue/gift = “예의 바르네. 별일이야.” 그녀가 클로버 부적을 던져 준다. “가져. 행운은 묻는 자를 좋아해. 오래는 아니지만.”
rpg_plus/prologue/snub = “알아서 찾게 될 거야.” 그녀가 고개를 돌린다. “다들 찾아. 어떤 이들은 살아서.”
rpg_plus/prologue/path = 오솔길이 마을로 내려간다. 안개가 마지못해 걷힌다. 네가 어디로 가는지 아는 것처럼.
rpg_plus/prologue/mage_hint = 지팡이가 조용히 불꽃을 튀긴다. 늑대는 불을 싫어한다지. 지팡이도 늑대를 싫어하는 모양이다.
rpg_plus/prologue/sheet_hint = 네 시트는 위쪽 막대의 책 버튼이야: 능력치, 레벨, 장비. 장비는 가방에서 착용해.
rpg_plus/yard/intro = “자,” 스승이 팔짱을 낀다. “보여 봐. 죽지만 마라. 난 책임 안 진다.”
rpg_plus/yard/ask = 뭘 할까?
rpg_plus/yard/opt_drill = 타격 훈련 (+20 경험치, 한 번)
rpg_plus/yard/opt_log = 통나무를 머리 위로 든다 [힘 12]
rpg_plus/yard/opt_back = 마을로 돌아간다
rpg_plus/yard/drill_done = “나쁘지 않군. 이런 걸 백 번만 더 하면 싸움꾼으로 보일 거다. 멀리서 보면.”
rpg_plus/yard/drilled = “오늘은 그만. 근육은 잘 때 자란다. 가서 자라.”
rpg_plus/yard/log_ok = “하! 들었군.” 스승이 작은 병을 던져 준다. “힘의 강장제다. 고맙단 말은 됐고. 빈속에 마시지 마라.”
rpg_plus/yard/log_again = “또? 허세는. 강장제는 더 없다. 존중은 있다. 조금.”
rpg_plus/yard/log_fail = “통나무가 이겼군. 그럴 수 있지. 좀 더 크든가, 상인한테 힘의 강장제를 사라. 효과 있다더라. 상인이 그러더라.”
rpg_plus/trainer/hello = “신참이냐? 손 좀 보자. 아하... 해볼 만은 하군. 아주 마음먹으면.”
rpg_plus/trainer/veteran = “단단해졌군. 3레벨이라. 곧 나를 가르치려 들겠지. 하지 마라.”
rpg_plus/trainer/opt_yard = 수련장으로 간다
rpg_plus/trainer/opt_later = 지금은 됐어
rpg_plus/trainer/bye = “손이 근질거리면 와라. 늑대한테 먹히면 안 와도 된다.”
rpg_plus/seer/hello = “무엇이 기다리는지 알고 싶어? 손을 줘. 그거 말고 — 도둑질 안 하는 손.”
rpg_plus/seer/fortune = “동굴의 늑대는 강철보다 불을 더 무서워해. 그리고 보호막이 없는 데를 쳐. 여기까진 공짜야. 나머진 아니고.”
rpg_plus/seer/charm = “그리고 부적 하나 구해. 행운은 빈손에 붙어 있지 않아. 가득 찬 손에도 오래는 아니고.”
rpg_plus/seer/fog = “안개... 아무것도 안 보여. 너한테 미래가 없거나, 오늘 별들이 심술이 났거나. 내일 와. 내일이 있다면.”
rpg_plus/chest/closed = 상자는 잠겨 있지 않다. 주인이 사람을 잘 믿거나, 안에 희망만 넣어 두었거나.
rpg_plus/chest/coins = 동전 열 닢. 주인은 사람을 잘 믿었다. 과거형이다.
rpg_plus/chest/empty = 비었다. 믿음은 동전과 함께 바닥났다.
rpg_plus/slime/pet = 길들인 슬라임. 누군가 손으로 먹이를 준다. 손은 아직 멀쩡하다.
