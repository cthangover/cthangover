rpg_plus/prologue/title = The crossroads
rpg_plus/prologue/line1 = The signpost honestly points three ways at once. None of them looks worth the walk.
rpg_plus/prologue/line2 = Below lies the village by the Grey Forest. They say it needs someone who is not afraid of wolves. Or is, but quietly. Twenty-five coins clink in your purse — all that is left of your old life.
rpg_plus/prologue/ask = Who were you before you came here?
rpg_plus/prologue/opt_warrior = A soldier. A sword is simple.
rpg_plus/prologue/opt_mage = A mage's apprentice. Fire listens to me.
rpg_plus/prologue/opt_rogue = A wanderer. You can strike a deal with anyone.
rpg_plus/prologue/warrior = The wooden sword on your back is all the barracks let you keep. That, and the habit of striking first.
rpg_plus/prologue/mage = The staff is warm, the crystal hums. Your teacher said fire obeys the clever. He never got round to the rest.
rpg_plus/prologue/rogue = A dagger up the sleeve, a smile at the ready. Doors open for the smile. The ones that don't, open for the dagger.
rpg_plus/prologue/seer = A wanderer in a lilac cloak sits by the signpost. She looks at you as if she already knew how it ends, and finds it boring.
rpg_plus/prologue/seer_ask = What will you say to her?
rpg_plus/prologue/opt_ask_way = Politely ask the way [Charisma 10]
rpg_plus/prologue/opt_pass = Walk past in silence
rpg_plus/prologue/gift = “Polite. Fancy that.” She tosses you a clover charm. “Keep it. Luck loves those who ask. Not for long, but it does.”
rpg_plus/prologue/snub = “You'll find it yourself,” she turns away. “Everyone does. Some even alive.”
rpg_plus/prologue/path = The path runs down to the village. The mist parts reluctantly, as if it knew where you were going.
rpg_plus/prologue/mage_hint = The staff gives a quiet crackle of sparks. Wolves, they say, dislike fire. The staff seems to dislike wolves.
rpg_plus/prologue/sheet_hint = Your sheet is the book button on the top bar: stats, level, equipment. Gear is put on from the bag.
rpg_plus/yard/intro = “Well,” the master folds his arms. “Show me. Just don't kill yourself, I'm not answering for you.”
rpg_plus/yard/ask = What shall we do?
rpg_plus/yard/opt_drill = Drill your strikes (+20 exp, once)
rpg_plus/yard/opt_log = Lift the log above your head [Strength 12]
rpg_plus/yard/opt_back = Go back to the village
rpg_plus/yard/drill_done = “Not bad. A hundred more of those and you'll pass for a fighter. From a distance.”
rpg_plus/yard/drilled = “That's enough for today. Muscles grow while you sleep. Go to sleep.”
rpg_plus/yard/log_ok = “Ha! You lifted it.” The master tosses you a vial. “Strength tonic. Don't thank me. And don't drink it on an empty stomach.”
rpg_plus/yard/log_again = “Again? Show-off. No more tonic. There's respect. A little.”
rpg_plus/yard/log_fail = “The log won. It happens. Grow a bit — or buy a strength tonic from the merchant. They say it helps. The merchant says.”
rpg_plus/trainer/hello = “New here? Show me your hands. Aha... I can work with that. If I really try.”
rpg_plus/trainer/veteran = “You've toughened up. Level three. Soon you'll start teaching me. Don't.”
rpg_plus/trainer/opt_yard = Go to the training yard
rpg_plus/trainer/opt_later = Not now
rpg_plus/trainer/bye = “Come back when your hands start itching. If the wolf eats you, don't bother.”
rpg_plus/seer/hello = “Want to know what awaits you? Give me your hand. Not that one — the one you don't steal with.”
rpg_plus/seer/fortune = “The wolf at the cave fears fire more than steel. And strike where it has no shield. That part is free. The rest isn't.”
rpg_plus/seer/charm = “And find yourself a charm. Luck does not cling to empty hands. Nor to full ones for long, mind.”
rpg_plus/seer/fog = “Mist... I see nothing. Either you have no future or the stars are cross today. Come tomorrow. If there is one.”
rpg_plus/chest/closed = The chest is not locked. Its owner is either trusting or keeps only hopes in it.
rpg_plus/chest/coins = Ten coins. The owner was trusting. Was.
rpg_plus/chest/empty = Empty. The trust ran out with the coins.
rpg_plus/slime/pet = A tame slime. Someone feeds it by hand. The hands are still whole.
