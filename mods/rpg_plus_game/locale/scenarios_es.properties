rpg_plus/prologue/title = El cruce
rpg_plus/prologue/line1 = El poste señala con honradez tres caminos a la vez. Ninguno apetece.
rpg_plus/prologue/line2 = Abajo está la aldea junto al Bosque Gris. Dicen que necesita a alguien que no tema a los lobos. O que los tema, pero en silencio. En la bolsa tintinean veinticinco monedas: todo lo que queda de tu vida anterior.
rpg_plus/prologue/ask = ¿Quién eras antes de llegar aquí?
rpg_plus/prologue/opt_warrior = Un soldado. Una espada es sencilla.
rpg_plus/prologue/opt_mage = Aprendiz de mago. El fuego me escucha.
rpg_plus/prologue/opt_rogue = Un vagabundo. Con cualquiera se llega a un trato.
rpg_plus/prologue/warrior = La espada de madera a la espalda es todo lo que te dejó el cuartel. Eso y la costumbre de golpear primero.
rpg_plus/prologue/mage = El bastón está tibio y el cristal zumba. Tu maestro decía que el fuego obedece a los listos. Del resto no llegó a hablar.
rpg_plus/prologue/rogue = Una daga en la manga y una sonrisa a punto. Las puertas se abren con la sonrisa. Las que no, con la daga.
rpg_plus/prologue/seer = Junto al poste se sienta una caminante de capa lila. Te mira como si ya supiera cómo acaba todo, y le aburriera.
rpg_plus/prologue/seer_ask = ¿Qué le dirás?
rpg_plus/prologue/opt_ask_way = Preguntar el camino con cortesía [Carisma 10]
rpg_plus/prologue/opt_pass = Pasar de largo en silencio
rpg_plus/prologue/gift = —Educado. Mira tú. —Te lanza un amuleto de trébol—. Quédatelo. La suerte quiere a quien pregunta. Poco tiempo, pero quiere.
rpg_plus/prologue/snub = —Ya lo encontrarás —se da la vuelta—. Todos lo encuentran. Algunos, incluso vivos.
rpg_plus/prologue/path = El sendero baja hacia la aldea. La niebla se abre a regañadientes, como si supiera adónde vas.
rpg_plus/prologue/mage_hint = El bastón chasquea una chispa. Dicen que a los lobos no les gusta el fuego. Al bastón, al parecer, no le gustan los lobos.
rpg_plus/prologue/sheet_hint = Tu hoja es el botón del libro en la barra superior: estadísticas, nivel, equipo. El equipo se pone desde la bolsa.
rpg_plus/yard/intro = —Bueno —el maestro se cruza de brazos—. Enséñame. Solo no te mates, que no respondo por ti.
rpg_plus/yard/ask = ¿Qué hacemos?
rpg_plus/yard/opt_drill = Practicar golpes (+20 de experiencia, una vez)
rpg_plus/yard/opt_log = Levantar el tronco sobre la cabeza [Fuerza 12]
rpg_plus/yard/opt_back = Volver a la aldea
rpg_plus/yard/drill_done = —No está mal. Cien más como esos y pasarás por luchador. De lejos.
rpg_plus/yard/drilled = —Basta por hoy. Los músculos crecen mientras duermes. Vete a dormir.
rpg_plus/yard/log_ok = —¡Ja! Lo levantaste. —El maestro te lanza un frasco—. Tónico de fuerza. No me des las gracias. Y no lo bebas en ayunas.
rpg_plus/yard/log_again = —¿Otra vez? Fanfarrón. No hay más tónico. Hay respeto. Un poco.
rpg_plus/yard/log_fail = —Ganó el tronco. Pasa. Crece un poco… o cómprale un tónico de fuerza al mercader. Dicen que ayuda. Lo dice el mercader.
rpg_plus/trainer/hello = —¿Nuevo? Enséñame las manos. Ajá... con esto se puede trabajar. Si uno se empeña.
rpg_plus/trainer/veteran = —Te has curtido. Nivel tres. Pronto querrás enseñarme a mí. Ni se te ocurra.
rpg_plus/trainer/opt_yard = Ir al patio de entrenamiento
rpg_plus/trainer/opt_later = Ahora no
rpg_plus/trainer/bye = —Vuelve cuando te piquen las manos. Si te come el lobo, no hace falta.
rpg_plus/seer/hello = —¿Quieres saber qué te espera? Dame la mano. Esa no: la que no usas para robar.
rpg_plus/seer/fortune = —El lobo de la cueva teme más al fuego que al acero. Y golpea donde no tenga escudo. Esto es gratis. Lo demás, no.
rpg_plus/seer/charm = —Y búscate un amuleto. La suerte no se agarra a manos vacías. A las llenas tampoco por mucho tiempo.
rpg_plus/seer/fog = —Niebla... No veo nada. O no tienes futuro, o las estrellas están de malas. Vuelve mañana. Si hay mañana.
rpg_plus/chest/closed = El cofre no está cerrado. Su dueño o es confiado o solo guarda esperanzas en él.
rpg_plus/chest/coins = Diez monedas. El dueño era confiado. Era.
rpg_plus/chest/empty = Vacío. La confianza se acabó con las monedas.
rpg_plus/slime/pet = Un slime domesticado. Alguien le da de comer en la mano. Las manos siguen enteras.
