rpg_plus/prologue/title = 十字路口
rpg_plus/prologue/line1 = 路标老老实实地同时指向三个方向。哪一边都不想去。
rpg_plus/prologue/line2 = 下面是灰森林边的村子。听说那里需要一个不怕狼的人。或者怕，但别出声。钱袋里叮当响着二十五枚硬币——前半生剩下的全部。
rpg_plus/prologue/ask = 来这里之前，你是什么人？
rpg_plus/prologue/opt_warrior = 当兵的。剑很简单。
rpg_plus/prologue/opt_mage = 法师的学徒。火会听我的。
rpg_plus/prologue/opt_rogue = 流浪汉。跟谁都能谈成。
rpg_plus/prologue/warrior = 背上的木剑是军营留给你的全部。还有先动手的习惯。
rpg_plus/prologue/mage = 法杖温热，水晶嗡鸣。老师说过，火只听聪明人的话。至于其他人——他没来得及讲。
rpg_plus/prologue/rogue = 袖里藏刀，笑容随时奉上。门会为笑容打开。打不开的——就交给刀。
rpg_plus/prologue/seer = 路标旁坐着一位披淡紫斗篷的行者。她看你的样子，像是早知道结局，而且提前觉得无聊。
rpg_plus/prologue/seer_ask = 你要对她说什么？
rpg_plus/prologue/opt_ask_way = 客气地问路［魅力 10］
rpg_plus/prologue/opt_pass = 默默走过
rpg_plus/prologue/gift = “有礼貌。真稀奇。”她把一枚四叶草护符扔给你。“拿着。运气喜欢肯开口的人。喜欢得不久，但喜欢。”
rpg_plus/prologue/snub = “你自己会找到的，”她转过身去，“谁都找得到。有些人甚至是活着找到的。”
rpg_plus/prologue/path = 小路奔向村子。雾气不情不愿地散开，好像知道你要去哪儿。
rpg_plus/prologue/mage_hint = 法杖轻轻噼啪一声迸出火星。据说狼不喜欢火。看来法杖也不喜欢狼。
rpg_plus/prologue/sheet_hint = 你的角色面板是顶部栏上的书本按钮：属性、等级、装备。装备从背包里穿上。
rpg_plus/yard/intro = “好了，”师父抱起双臂，“露一手吧。别把自己弄死就行，我可不负责。”
rpg_plus/yard/ask = 做点什么？
rpg_plus/yard/opt_drill = 练习招式（+20 经验，仅一次）
rpg_plus/yard/opt_log = 把木头举过头顶［力量 12］
rpg_plus/yard/opt_back = 回村子
rpg_plus/yard/drill_done = “不赖。再练一百下，就能冒充战士了。远远地看的话。”
rpg_plus/yard/drilled = “今天够了。肌肉是睡觉时长的。去睡吧。”
rpg_plus/yard/log_ok = “哈！举起来了。”师父丢给你一个小瓶。“力量药剂。别道谢。也别空腹喝。”
rpg_plus/yard/log_again = “又来？爱显摆。药剂没了。有点尊重。一点点。”
rpg_plus/yard/log_fail = “木头赢了。常有的事。再长长——或者找商人买瓶力量药剂。听说有用。商人说的。”
rpg_plus/trainer/hello = “新来的？手伸出来。嗯……还能练。要是下狠心的话。”
rpg_plus/trainer/veteran = “你结实了。三级了。快要轮到你来教我了。别。”
rpg_plus/trainer/opt_yard = 去练武场
rpg_plus/trainer/opt_later = 现在不行
rpg_plus/trainer/bye = “手痒了再来。要是被狼吃了，就不用来了。”
rpg_plus/seer/hello = “想知道等着你的是什么？把手给我。不是这只——是你不用来偷东西的那只。”
rpg_plus/seer/fortune = “洞口的狼怕火胜过怕钢。还有，往它没护盾的地方打。这些免费。其余的不免费。”
rpg_plus/seer/charm = “再给自己找个护符。运气不会黏着空手。满手的也黏不久。”
rpg_plus/seer/fog = “雾……什么也看不见。要么你没有未来，要么今天星星心情不好。明天再来。如果有明天的话。”
rpg_plus/chest/closed = 箱子没上锁。主人要么很信任别人，要么里面只放着希望。
rpg_plus/chest/coins = 十枚硬币。主人曾经很信任别人。曾经。
rpg_plus/chest/empty = 空的。信任和硬币一起用完了。
rpg_plus/slime/pet = 一只驯服的史莱姆。有人用手喂它。手暂时还在。
