rpg_plus/prologue/title = Ngã ba
rpg_plus/prologue/line1 = Tấm biển thật thà chỉ cùng lúc ba hướng. Hướng nào cũng chẳng muốn đi.
rpg_plus/prologue/line2 = Phía dưới là ngôi làng bên Rừng Xám. Nghe nói ở đó cần một kẻ không sợ sói. Hoặc có sợ, nhưng im lặng. Trong túi leng keng hai mươi lăm đồng xu — tất cả những gì còn lại của kiếp trước.
rpg_plus/prologue/ask = Trước khi tới đây, ngươi là ai?
rpg_plus/prologue/opt_warrior = Một người lính. Kiếm thì đơn giản.
rpg_plus/prologue/opt_mage = Học trò pháp sư. Lửa nghe lời ta.
rpg_plus/prologue/opt_rogue = Kẻ lang thang. Thương lượng được với bất kỳ ai.
rpg_plus/prologue/warrior = Thanh kiếm gỗ sau lưng là tất cả những gì doanh trại để lại cho ngươi. Cùng với thói quen ra đòn trước.
rpg_plus/prologue/mage = Cây gậy ấm, viên pha lê ngân nga. Thầy bảo lửa nghe lời kẻ thông minh. Về những người còn lại, ông chưa kịp nói.
rpg_plus/prologue/rogue = Dao găm trong tay áo, nụ cười luôn sẵn. Cửa mở vì nụ cười. Cửa nào không mở thì có dao găm.
rpg_plus/prologue/seer = Bên tấm biển có một lữ khách khoác áo choàng tím nhạt. Cô nhìn ngươi như thể đã biết kết cục, và thấy chán từ trước.
rpg_plus/prologue/seer_ask = Ngươi sẽ nói gì với cô ấy?
rpg_plus/prologue/opt_ask_way = Lễ phép hỏi đường [Sức hút 10]
rpg_plus/prologue/opt_pass = Lặng lẽ đi qua
rpg_plus/prologue/gift = “Lễ phép. Lạ thật.” Cô ném cho ngươi một lá bùa cỏ bốn lá. “Giữ lấy. Vận may thích kẻ biết hỏi. Không lâu, nhưng thích.”
rpg_plus/prologue/snub = “Tự ngươi sẽ tìm ra,” cô quay đi. “Ai cũng tìm ra. Vài người còn sống sót nữa.”
rpg_plus/prologue/path = Con đường chạy xuống làng. Sương mù tản ra miễn cưỡng, như thể biết ngươi đang đi đâu.
rpg_plus/prologue/mage_hint = Cây gậy khẽ lách tách tia lửa. Nghe nói sói không ưa lửa. Có vẻ cây gậy cũng không ưa sói.
rpg_plus/prologue/sheet_hint = Bảng của ngươi là nút hình quyển sách trên thanh trên cùng: chỉ số, cấp, trang bị. Đồ được mặc từ trong túi.
rpg_plus/yard/intro = “Nào,” sư phụ khoanh tay. “Cho ta xem. Chỉ đừng tự giết mình, ta không chịu trách nhiệm đâu.”
rpg_plus/yard/ask = Làm gì đây?
rpg_plus/yard/opt_drill = Luyện đòn (+20 kinh nghiệm, một lần)
rpg_plus/yard/opt_log = Nâng khúc gỗ qua đầu [Sức mạnh 12]
rpg_plus/yard/opt_back = Quay về làng
rpg_plus/yard/drill_done = “Không tệ. Thêm trăm đòn như thế là trông giống chiến binh rồi. Từ xa.”
rpg_plus/yard/drilled = “Hôm nay thế là đủ. Cơ bắp lớn khi ngủ. Đi ngủ đi.”
rpg_plus/yard/log_ok = “Ha! Nâng được rồi.” Sư phụ ném cho ngươi một lọ. “Thuốc sức mạnh. Khỏi cảm ơn. Và đừng uống lúc bụng đói.”
rpg_plus/yard/log_again = “Lại nữa? Khoe khoang. Hết thuốc rồi. Còn chút nể phục. Chút thôi.”
rpg_plus/yard/log_fail = “Khúc gỗ thắng. Chuyện thường. Lớn thêm chút nữa — hoặc mua thuốc sức mạnh của thương nhân. Nghe nói có tác dụng. Thương nhân nói thế.”
rpg_plus/trainer/hello = “Người mới à? Đưa tay ta xem. À... cũng luyện được. Nếu thật cố gắng.”
rpg_plus/trainer/veteran = “Ngươi rắn rỏi hơn rồi. Cấp ba. Sắp tới định dạy lại ta à. Đừng.”
rpg_plus/trainer/opt_yard = Đến bãi tập
rpg_plus/trainer/opt_later = Để sau
rpg_plus/trainer/bye = “Khi nào tay ngứa ngáy thì quay lại. Bị sói ăn rồi thì khỏi.”
rpg_plus/seer/hello = “Muốn biết điều gì đang chờ ngươi? Đưa tay đây. Không phải tay đó — tay không dùng để trộm ấy.”
rpg_plus/seer/fortune = “Con sói ở hang sợ lửa hơn thép. Và hãy đánh vào chỗ nó không có khiên. Phần này miễn phí. Phần còn lại thì không.”
rpg_plus/seer/charm = “Và kiếm lấy một lá bùa. Vận may không bám vào bàn tay trống. Tay đầy cũng chẳng bám lâu.”
rpg_plus/seer/fog = “Sương mù... Ta chẳng thấy gì. Hoặc ngươi không có tương lai, hoặc hôm nay sao xấu tính. Mai quay lại. Nếu có ngày mai.”
rpg_plus/chest/closed = Rương không khóa. Chủ nhân hoặc cả tin, hoặc chỉ cất hy vọng trong đó.
rpg_plus/chest/coins = Mười đồng xu. Chủ nhân từng cả tin. Từng.
rpg_plus/chest/empty = Trống rỗng. Lòng tin cạn cùng với đồng xu.
rpg_plus/slime/pet = Một con slime thuần. Có người cho nó ăn bằng tay. Tay vẫn còn nguyên.
