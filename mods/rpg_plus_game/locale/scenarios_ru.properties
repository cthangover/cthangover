rpg_plus/prologue/title = Перекрёсток
rpg_plus/prologue/line1 = Указатель честно показывает в три стороны сразу. Идти не хочется ни в одну.
rpg_plus/prologue/line2 = Внизу — деревня у Серого леса. Говорят, там нужен кто-нибудь, кто не боится волков. Или боится, но молча. В кошельке звенят двадцать пять монет — всё, что осталось от прошлой жизни.
rpg_plus/prologue/ask = Кем ты был, пока не пришёл сюда?
rpg_plus/prologue/opt_warrior = Солдатом. Меч — это просто.
rpg_plus/prologue/opt_mage = Учеником мага. Огонь меня слушается.
rpg_plus/prologue/opt_rogue = Бродягой. Договориться можно с кем угодно.
rpg_plus/prologue/warrior = Деревянный меч за спиной — всё, что тебе оставили в казарме. Кроме привычки бить первым.
rpg_plus/prologue/mage = Посох тёплый, кристалл гудит. Учитель говорил, что огонь слушается умных. Про остальных он не успел рассказать.
rpg_plus/prologue/rogue = Кинжал в рукаве, улыбка наготове. Двери открываются от улыбки. Те, что не открываются, — от кинжала.
rpg_plus/prologue/seer = У указателя сидит странница в лиловом плаще. Смотрит так, будто уже знает, чем всё кончится, и ей заранее скучно.
rpg_plus/prologue/seer_ask = Что скажешь ей?
rpg_plus/prologue/opt_ask_way = Вежливо спросить дорогу [Харизма 10]
rpg_plus/prologue/opt_pass = Молча пройти мимо
rpg_plus/prologue/gift = — Вежливый. Надо же. — Она бросает тебе оберег из клевера. — Держи. Удача любит тех, кто спрашивает. Недолго, но любит.
rpg_plus/prologue/snub = — Найдёшь сам, — она отворачивается. — Все находят. Некоторые даже живыми.
rpg_plus/prologue/path = Тропа сбегает к деревне. Туман расступается неохотно — будто знает, куда ты идёшь.
rpg_plus/prologue/mage_hint = Посох тихо щёлкает искрой. Волки, говорят, огня не любят. Посох, похоже, не любит волков.
rpg_plus/prologue/sheet_hint = Твой лист — кнопка с книгой на панели сверху: статы, уровень, снаряжение. Надеть вещь можно из сумки.
rpg_plus/yard/intro = — Ну, — наставник скрещивает руки. — Показывай. Только не убейся: я за тебя не отвечаю.
rpg_plus/yard/ask = Чем займёмся?
rpg_plus/yard/opt_drill = Отработать удары (+20 опыта, один раз)
rpg_plus/yard/opt_log = Поднять бревно над головой [Сила 12]
rpg_plus/yard/opt_back = Вернуться в деревню
rpg_plus/yard/drill_done = — Неплохо. Ещё сотня таких — и сойдёшь за бойца. Издалека.
rpg_plus/yard/drilled = — На сегодня хватит. Мышцы растут, пока спишь. Иди спи.
rpg_plus/yard/log_ok = — Ха! Поднял. — Наставник бросает тебе склянку. — Тоник силы. Не благодари. И не пей натощак.
rpg_plus/yard/log_again = — Опять? Хвастун. Тоника больше нет. Есть уважение. Немного.
rpg_plus/yard/log_fail = — Бревно победило. Бывает. Подрасти — или купи у торговца тоник силы. Говорят, помогает. Торговец говорит.
rpg_plus/trainer/hello = — Новенький? Руки покажи. Ага... С этим можно работать. Если очень захотеть.
rpg_plus/trainer/veteran = — А ты окреп. Третий уровень. Скоро меня учить начнёшь. Не начинай.
rpg_plus/trainer/opt_yard = Пойти на тренировочную площадку
rpg_plus/trainer/opt_later = Не сейчас
rpg_plus/trainer/bye = — Приходи, когда руки зачешутся. Если волк загрызёт — можешь не приходить.
rpg_plus/seer/hello = — Хочешь знать, что тебя ждёт? Дай руку. Не эту — ту, которой не воруешь.
rpg_plus/seer/fortune = — Волк у пещеры боится огня больше, чем стали. И бей туда, где у него нет щита. Это бесплатно. Остальное — нет.
rpg_plus/seer/charm = — И найди себе оберег. Удача не держится за пустые руки. За полные, впрочем, тоже недолго.
rpg_plus/seer/fog = — Туман... Ничего не вижу. Либо у тебя нет будущего, либо звёзды сегодня злые. Приходи завтра. Если будет завтра.
rpg_plus/chest/closed = Сундук не заперт. Хозяин либо доверчив, либо хранит в нём только надежды.
rpg_plus/chest/coins = Десять монет. Хозяин был доверчив. Был.
rpg_plus/chest/empty = Пусто. Доверие кончилось вместе с монетами.
rpg_plus/slime/pet = Ручной слизень. Его кормят с руки. Руки пока целы.
