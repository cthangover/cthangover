rpg_plus/prologue/title = Перекрёсток
rpg_plus/prologue/line1 = Указатель честно показывает в три стороны сразу. Идти не хочется ни в одну.
rpg_plus/prologue/line2 = Внизу — деревня у Серого леса. Говорят, там нужен кто-нибудь, кто не боится волков. Или боится, но молча. В кошельке звенят двадцать пять монет — всё, что осталось от прошлой жизни.
rpg_plus/prologue/ask = Кем ты был, пока не пришёл сюда?
rpg_plus/prologue/opt_warrior = Солдатом. Меч — это просто.
rpg_plus/prologue/opt_mage = Учеником мага. Огонь меня слушается.
rpg_plus/prologue/opt_rogue = Бродягой. Договориться можно с кем угодно.
rpg_plus/prologue/warrior = Деревянный меч за спиной — всё, что тебе оставили в казарме. Кроме привычки бить первым.
rpg_plus/prologue/mage = Посох тёплый, кристалл гудит. Учитель говорил, что огонь слушается умных. Про остальных он не успел рассказать.
rpg_plus/prologue/rogue = Кинжал в рукаве, улыбка наготове. Двери открываются от улыбки. Те, что не открываются, — от кинжала.
rpg_plus/prologue/seer = У указателя сидит странница в лиловом плаще. Смотрит так, будто уже знает, чем всё кончится, и ей заранее скучно.
rpg_plus/prologue/seer_ask = Что скажешь ей?
rpg_plus/prologue/opt_ask_way = Вежливо спросить дорогу [Харизма 10]
rpg_plus/prologue/opt_pass = Молча пройти мимо
rpg_plus/prologue/gift = — Вежливый. Надо же. — Она бросает тебе оберег из клевера. — Держи. Удача любит тех, кто спрашивает. Недолго, но любит.
rpg_plus/prologue/snub = — Найдёшь сам, — она отворачивается. — Все находят. Некоторые даже живыми.
rpg_plus/prologue/path = Тропа сбегает к деревне. Туман расступается неохотно — будто знает, куда ты идёшь.
rpg_plus/prologue/mage_hint = Посох тихо щёлкает искрой. Волки, говорят, огня не любят. Посох, похоже, не любит волков.
rpg_plus/prologue/sheet_hint = Твой лист — кнопка с книгой на панели сверху: статы, уровень, снаряжение. Надеть вещь можно из сумки.
rpg_plus/yard/intro = — Ну, — наставник скрещивает руки. — Показывай. Только не убейся: я за тебя не отвечаю.
rpg_plus/yard/ask = Чем займёмся?
rpg_plus/yard/opt_drill = Отработать удары (+20 опыта, один раз)
rpg_plus/yard/opt_log = Поднять бревно над головой [Сила 12]
rpg_plus/yard/opt_back = Вернуться в деревню
rpg_plus/yard/drill_done = — Неплохо. Ещё сотня таких — и сойдёшь за бойца. Издалека.
rpg_plus/yard/drilled = — На сегодня хватит. Мышцы растут, пока спишь. Иди спи.
rpg_plus/yard/log_ok = — Ха! Поднял. — Наставник бросает тебе склянку. — Тоник силы. Не благодари. И не пей натощак.
rpg_plus/yard/log_again = — Опять? Хвастун. Тоника больше нет. Есть уважение. Немного.
rpg_plus/yard/log_fail = — Бревно победило. Бывает. Подрасти — или купи у торговца тоник силы. Говорят, помогает. Торговец говорит.
rpg_plus/trainer/hello = — Новенький? Руки покажи. Ага... С этим можно работать. Если очень захотеть.
rpg_plus/trainer/veteran = — А ты окреп. Третий уровень. Скоро меня учить начнёшь. Не начинай.
rpg_plus/trainer/opt_yard = Пойти на тренировочную площадку
rpg_plus/trainer/opt_later = Не сейчас
rpg_plus/trainer/bye = — Приходи, когда руки зачешутся. Если волк загрызёт — можешь не приходить.
rpg_plus/seer/hello = — Хочешь знать, что тебя ждёт? Дай руку. Не эту — ту, которой не воруешь.
rpg_plus/seer/fortune = — Волк у пещеры боится огня больше, чем стали. И бей туда, где у него нет щита. Это бесплатно. Остальное — нет.
rpg_plus/seer/charm = — И найди себе оберег. Удача не держится за пустые руки. За полные, впрочем, тоже недолго.
rpg_plus/seer/fog = — Туман... Ничего не вижу. Либо у тебя нет будущего, либо звёзды сегодня злые. Приходи завтра. Если будет завтра.
rpg_plus/chest/closed = Сундук не заперт. Хозяин либо доверчив, либо хранит в нём только надежды.
rpg_plus/chest/coins = Десять монет. Хозяин был доверчив. Был.
rpg_plus/chest/empty = Пусто. Доверие кончилось вместе с монетами.
rpg_plus/slime/pet = Ручной слизень. Его кормят с руки. Руки пока целы.

rpg_plus/woodland/elder/1 = — Волк режет коз. Лес гасит фонари. Ведомость требует одного виновного. Волк уже внесён.
rpg_plus/woodland/elder/2 = Волк умеет гасить фонари?
rpg_plus/woodland/elder/3 = Где его искать?
rpg_plus/woodland/elder/4 = — Нет. Но писать «неизвестное» — это ещё три бланка.
rpg_plus/woodland/elder/5 = Староста кладёт на стол обломок фонаря. Внутри — пустое гнездо размером с кулак.
rpg_plus/woodland/elder/6 = — Раньше в святилище горел янтарь. Потом мы решили, что светить деревне полезнее. Лес оказался другого мнения.
rpg_plus/woodland/elder/7 = — На восток, за пруд. Волк сидит у пещеры. Прогони его. Если найдёшь янтарь — не продавай. Один раз мы уже заработали.
rpg_plus/woodland/elder/8 = — Янтарь у тебя? Значит, лес перестал доверять даже волкам.
rpg_plus/woodland/elder/9 = — У колодца верстак. Янтарь, две смолы, две связки веток — получится сторожевой фонарь. Смола остаётся от слизней; торговец тоже держит запас.
rpg_plus/woodland/elder/10 = — Потом через пещеру к святилищу. Свету там найдётся работа. Только не спрашивай меня, какая.
rpg_plus/woodland/elder/11 = — Деревня снова спит. — Староста отсчитывает тридцать пять монет. — Впервые за месяц никто не написал жалобу на темноту.
rpg_plus/woodland/elder/12 = — Теперь хотя бы будем знать, сколько берём.
rpg_plus/woodland/elder/13 = Староста гасит настольную лампу. За окном светлеет.
rpg_plus/woodland/elder/14 = — Налог на свет отменяю. — Он отсчитывает тридцать пять монет. — Не делай такого лица. На темноту пока тоже не ввожу.
rpg_plus/woodland/elder/15 = — Ведомость закрыта. Козы живы. Если найдёшь ещё одну древнюю тайну — сначала узнай, кто её обслуживает.
rpg_plus/woodland/herbalist/1 = — Руки обожгла о старый фонарь. Староста сказал: обычная смола. Обычная смола не кусается.
rpg_plus/woodland/herbalist/2 = — Смешай гриб со смолой от слизня на верстаке у колодца. Мазь принеси мне. Название не пугайся: «лесная» — это состав, не гарантия.
rpg_plus/woodland/herbalist/3 = — Нужна лесная мазь. Гриб и смола. Если материалов нет — торговец у восточного дома поможет за монеты.
rpg_plus/woodland/herbalist/4 = Отдать лесную мазь
rpg_plus/woodland/herbalist/5 = Оставить пока себе
rpg_plus/woodland/herbalist/6 = Травница отвинчивает крышку зубами и молча мажет руки. Только после этого достаёт кошель.
rpg_plus/woodland/herbalist/7 = — Двенадцать монет. И ещё работа: курьер понёс к святилищу запасной фитиль. Не вернулся. Ищи на юге леса.
rpg_plus/woodland/herbalist/8 = — Курьер всё ещё в лесу. Южнее тропы. Он носит зелёный жилет и дурные предчувствия.
rpg_plus/woodland/herbalist/9 = Она читает записку дважды. На второй раз переворачивает: оборот пуст.
rpg_plus/woodland/herbalist/10 = — «Лес не злится. Он считает». — Она прячет бумагу. — Для фонаря хватит двух смол. Третью оставь себе. За доставку.
rpg_plus/woodland/herbalist/11 = — Руки зажили. Курьер жив. Если хочешь отдохнуть — очаг у колодца. Без рецепта.
rpg_plus/woodland/courier/1 = — Посылку я доставил. — Курьер показывает пустую сумку. — Получатель не подписал. У получателя корни.
rpg_plus/woodland/courier/2 = Он протягивает записку: «Лес не злится. Он считает. Верните свет или начните платить честно».
rpg_plus/woodland/courier/3 = — Травнице отнеси. А я посижу. По договору мне положен обед. Договора при себе нет, но обед положен.
rpg_plus/woodland/courier/4 = — Иди. Я следом. Сначала найду, кому предъявить корни.
rpg_plus/woodland/workbench/1 = На верстаке лежит инструкция: «Не пробовать. Не нюхать. Если изделие заговорило — мастер не виноват».
rpg_plus/woodland/hearth/1 = У очага никто не требует подвига. Редкое место.
rpg_plus/woodland/shrine/1 = За аркой кто-то ведёт счёт. На слове «деревня» сбивается и начинает заново.
rpg_plus/woodland/beacon/1 = Пустое гнездо. Свет сюда уже приносили. Уносили тоже.
rpg_plus/woodland/beacon/2 = Нужен сторожевой фонарь: янтарь, две смолы, две связки веток. Верстак у деревенского колодца.
rpg_plus/woodland/beacon/3 = — ДОЛГ ПО СВЕТУ: ТРИДЦАТЬ ЛЕТ. — Голос под корнями шелестит бумагой. — КТО ОПЛАЧИВАЕТ?
rpg_plus/woodland/beacon/4 = Вернуть свет лесу. Пусть деревня научится зажигать свой.
rpg_plus/woodland/beacon/5 = Оставить фонарь деревне, заключить честный договор.
rpg_plus/woodland/beacon/6 = Сначала подумать
rpg_plus/woodland/beacon/7 = Ты ставишь фонарь на камень и открываешь створки. Янтарь прорастает тонкими корнями.
rpg_plus/woodland/beacon/8 = — ПРИНЯТО. — Пауза. — КВИТАНЦИЯ НЕ ПРЕДУСМОТРЕНА.
rpg_plus/woodland/beacon/9 = — Один фонарь на деревню. Взамен — ни одного топора за старой тропой. И учёт без старосты.
rpg_plus/woodland/beacon/10 = — СОГЛАСОВАНО. — На камне проступает отпечаток ладони. Слишком много пальцев. Ты всё равно прикладываешь свою.
rpg_plus/woodland/beacon/11 = Обратно идти легче. Не потому, что стало безопасно. Просто теперь дорога знает твоё имя.
rpg_plus/woodland/beacon/12 = В фонаре горит ровный свет. Кто-то под корнями старательно вычёркивает строки.
rpg_plus/woodland/beacon/13 = На камне растут молодые листья. Ведомость проросла.
rpg_plus/woodland/waystone/1 = На камне вырезано: «К святилищу — через пещеру на востоке. Не выносить свет. Не вносить поправки».

rpg_plus/woodland/lamplighter/1 = — Считаю фонари. Вчера семь. Сегодня шесть. Седьмой считает меня.
rpg_plus/woodland/lamplighter/2 = — Три раза протёр новый фонарь. Ни разу не потребовал козу. Успех.
rpg_plus/woodland/lamplighter/3 = — В лесу светлее. В деревне темнее. Зато свет теперь без процентов.

rpg_plus/woodland/elder/ready = — Собрал? Тогда через пещеру к святилищу. И не поднимай створки, пока не решишь, кому светить.
rpg_plus/woodland/amber/recovered = Сердце янтаря осталось у пещеры. На этот раз забираешь его с собой.
