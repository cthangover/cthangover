mod_schema_tools_name = スキーマツール
mod_schema_tools_desc = 注釈から作るエディター——RPG Maker のプラグインパラメーターを、どの MOD でも同梱できるデータにしたもの：schemas/*.json がシナリオの行動とコマンド、エンティティの種類のフィールドを記述する。各 MOD のスキーマは統合されるので、他人の種類にフィールドを足した MOD はすぐにそのエディターを得る。「データエディター」ウィンドウは記述された種類をフォームで編集し、コマンドパレットはフォームでシナリオの行を組み立ててエディターに挿入し、バリデーターは全 MOD のシナリオとデータをスキーマで検査する。
