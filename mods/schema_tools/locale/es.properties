tools/schema/palette/hint = Elige una acción o un comando y rellena el formulario: la línea aparece abajo y se inserta en el editor de escenarios abierto bajo el cursor.
tools/schema/palette/no_editor = No hay ningún escenario abierto: abre uno en el editor de escenarios o copia la línea.
