mod_schema_tools_name = Herramientas de esquemas
mod_schema_tools_desc = Editores construidos a partir de anotaciones: los parámetros de plugins de RPG Maker convertidos en datos que cualquier mod incluye. Los archivos schemas/*.json describen acciones y comandos de escenarios y los campos de los tipos de entidades; los esquemas de los mods se fusionan, así que un mod que añade un campo a un tipo ajeno obtiene su editor al instante. La ventana Editor de datos edita cualquier tipo descrito con formularios, la paleta de comandos arma líneas de escenario con un formulario y las inserta en el editor, el validador comprueba los escenarios y datos de todos los mods según los esquemas.
