mod_schema_tools_name = 模式工具
mod_schema_tools_desc = 基于注解的编辑器——把 RPG Maker 的插件参数变成任何模组都能附带的数据：schemas/*.json 文件描述剧本的动作与命令以及实体类型的字段；各模组的模式会合并，所以给别人的类型加字段的模组立刻就有对应的编辑器。“数据编辑器”窗口用表单编辑任何已描述的类型，命令面板用表单拼出剧本行并插入编辑器，验证器按模式检查所有模组的剧本和数据。
tools/schema/palette/title = 命令面板
tools/schema/palette/hint = 选择一个动作或命令并填写表单：下方会出现该行，并插入到已打开的剧本编辑器的光标下方。
tools/schema/palette/no_editor = 没有打开的剧本：请在剧本编辑器中打开一个，或复制该行。
