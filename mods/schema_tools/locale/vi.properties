mod_schema_tools_name = Công cụ lược đồ
mod_schema_tools_desc = Trình sửa dựng từ chú thích — tham số plugin của RPG Maker biến thành dữ liệu mà mọi mod đều kèm được: các tệp schemas/*.json mô tả hành động, lệnh kịch bản và trường của các loại thực thể; lược đồ của các mod được gộp, nên mod thêm trường cho loại của người khác có ngay trình sửa cho nó. Cửa sổ Trình sửa dữ liệu sửa mọi loại đã mô tả bằng biểu mẫu, bảng lệnh dựng dòng kịch bản bằng biểu mẫu và chèn vào trình sửa, trình kiểm tra soát kịch bản và dữ liệu của mọi mod theo lược đồ.
tools/schema/palette/title = Bảng lệnh
tools/schema/palette/hint = Chọn một hành động hoặc lệnh và điền biểu mẫu: dòng lệnh hiện bên dưới và được chèn vào trình sửa kịch bản đang mở, dưới con trỏ.
tools/schema/palette/no_editor = Chưa mở kịch bản nào: hãy mở trong trình sửa kịch bản hoặc sao chép dòng.
