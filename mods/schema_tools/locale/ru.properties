mod_schema_tools_name = Инструменты схем
mod_schema_tools_desc = Редакторы по аннотациям — идея параметров плагинов RPG Maker, ставшая данными любого мода: файлы schemas/*.json описывают действия и команды сценариев и поля видов сущностей; схемы модов сливаются, поэтому мод, добавивший поле к чужому виду, сразу получает для него редактор. Окно «Редактор данных» правит любой описанный вид формами, палитра команд собирает строки сценария формой и вставляет их в редактор, валидатор проверяет сценарии и данные всех модов по схемам.
tools/schema/palette/title = Палитра команд
tools/schema/palette/hint = Выберите действие или команду, заполните форму — строка появится ниже и вставится в открытый редактор сценариев под курсор.
tools/schema/palette/no_editor = Нет открытого сценария: откройте его в редакторе сценариев или скопируйте строку.
