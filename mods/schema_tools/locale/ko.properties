mod_schema_tools_name = 스키마 도구
mod_schema_tools_desc = 주석으로 만드는 에디터 — RPG Maker 플러그인 매개변수를 어떤 모드든 담을 수 있는 데이터로 바꾼 것: schemas/*.json 파일이 시나리오의 행동과 명령, 엔티티 종류의 필드를 설명합니다. 모드들의 스키마가 합쳐지므로, 남의 종류에 필드를 더한 모드는 즉시 그 에디터를 얻습니다. ‘데이터 에디터’ 창은 설명된 모든 종류를 양식으로 편집하고, 명령 팔레트는 양식으로 시나리오 줄을 만들어 에디터에 넣으며, 검증기는 모든 모드의 시나리오와 데이터를 스키마로 검사합니다.
tools/schema/palette/title = 명령 팔레트
tools/schema/palette/hint = 행동이나 명령을 고르고 양식을 채우세요. 아래에 줄이 나타나고, 열린 시나리오 에디터의 커서 아래에 들어갑니다.
tools/schema/palette/no_editor = 열린 시나리오가 없습니다: 시나리오 에디터에서 열거나 줄을 복사하세요.
tools/schema/palette/inserted = {0}에 넣었습니다
tools/schema/palette/insert = 넣기
tools/schema/palette/insert_tip = 열린 시나리오의 커서 아래에 줄을 넣기
tools/schema/palette/copy = 복사
tools/schema/palette/copy_tip = 줄을 클립보드에 복사
tools/schema/palette/section_list = 행동과 명령
tools/schema/palette/search = 검색: 피해, 아이템, check…
