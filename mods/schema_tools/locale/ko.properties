tools/schema/data_editor/title = 데이터 에디터
tools/schema/data_editor/hint = 왼쪽에는 모드들이 설명한 모든 것: 능력치, 직업, 아이템, 캐릭터, 스킬. 여러 모드가 더한 필드가 한 양식에 모입니다.
