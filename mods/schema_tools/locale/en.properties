mod_schema_tools_name = Schema Tools
mod_schema_tools_desc = Editors built from annotations — RPG Maker plugin parameters turned into data any mod ships: schemas/*.json files describe scenario actions and commands and the fields of entity kinds; the mods' schemas merge, so a mod that adds a field to someone else's kind gets an editor for it at once. The Data Editor window edits any described kind with forms, the command palette builds scenario lines with a form and inserts them into the editor, the validator checks every mod's scenarios and data against the schemas.
