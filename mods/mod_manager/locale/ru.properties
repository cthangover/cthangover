mod_manager/enable_tooltip = Загружать мод в играх, которые его используют.
mod_manager/disable_tooltip = Не загружать мод. Файлы и сохранения останутся.
mod_manager/hint_mods_tab_title = Моды
mod_manager/hint_mods_tab_body = Каталог и установленные моды. Здесь вы управляете файлами, версиями и загрузкой модов в играх.
mod_manager/hint_collections_tab_title = Коллекции
mod_manager/hint_collections_tab_body = Готовые наборы модов, которые запускаются как отдельные игры. Их состав можно менять в редакторе схемы.
mod_manager/hint_collection_search_title = Поиск коллекций
mod_manager/hint_collection_search_body = Фильтрует карточки по названию, описанию, идентификатору и тегам.
mod_manager/hint_refresh_title = Обновить
mod_manager/hint_refresh_body = Заново загружает каталог и сверяет его с установленными модами. Текущие настройки не сбрасываются.
mod_manager/hint_mod_search_title = Поиск модов
mod_manager/hint_mod_search_body = Фильтрует список по названию, автору или идентификатору мода.
mod_manager/hint_mod_sort_title = Сортировка
mod_manager/hint_mod_sort_body = Меняет только порядок карточек: по имени, автору или состоянию установки.
mod_manager/hint_filters_reset_title = Сброс фильтров
mod_manager/hint_filters_reset_body = Возвращает поиск, состояния, категории и группировку к значениям по умолчанию.
mod_manager/hint_group_categories_title = Группировка по категориям
mod_manager/hint_group_categories_body = Объединяет карточки в разделы. Состояние модов при этом не меняется.
mod_manager/hint_mod_card_title = Карточка мода
mod_manager/hint_mod_card_body = Нажмите на свободное место карточки, чтобы открыть описание, зависимости и все действия с модом.
mod_manager/hint_mod_version_title = Версия мода
mod_manager/hint_mod_version_body = Выбирает версию для установки или обновления. Пометки показывают последнюю и уже установленную версии.
mod_manager/hint_mod_action_title = Действие с модом
mod_manager/hint_mod_action_body = Действие зависит от состояния: установка, обновление, смена версии, переустановка или удаление.
mod_manager/hint_mod_enabled_title = Загрузка мода
mod_manager/hint_mod_enabled_body = Выключенный мод остаётся на диске, но не загружается в играх. Сохранения и данные модов сохраняются.
mod_manager/hint_mod_delete_title = Удаление мода
mod_manager/hint_mod_delete_body = Удаляет файлы мода с устройства. Коллекции и сохранения игр не удаляются.
mod_manager/hint_mod_collections_title = Использование в коллекциях
mod_manager/hint_mod_collections_body = Открывает коллекции, в состав которых входит этот мод.
mod_manager/hint_collection_new_title = Новая коллекция
mod_manager/hint_collection_new_body = Создаёт пустую схему игры. Моды и правила можно добавить в редакторе.
mod_manager/hint_collection_apply_title = Применить состав
mod_manager/hint_collection_apply_body = Устанавливает недостающие моды и включает нужные. Перед выполнением можно посмотреть план.
mod_manager/hint_collection_edit_title = Настроить коллекцию
mod_manager/hint_collection_edit_body = Открывает состав игры: моды, зависимости, порядок загрузки и план изменений.
mod_manager/hint_collection_delete_title = Удаление коллекции
mod_manager/hint_collection_delete_body = Удаляет только коллекцию. Установленные моды и сохранения игр остаются.
mod_manager/hint_collection_add_mechanic_title = Добавить механику
mod_manager/hint_collection_add_mechanic_body = Добавляет в схему группу для связанных модов и их настроек.
mod_manager/hint_collection_game_title = Редактируемая коллекция
mod_manager/hint_collection_game_body = Переключает редактор на другую игру, не закрывая текущий экран.
mod_manager/hint_collection_problems_title = Проблемы схемы
mod_manager/hint_collection_problems_body = Показывает отсутствующие моды, неподходящие версии и конфликты, которые мешают запуску.
mod_manager/hint_collection_plan_title = План изменений
mod_manager/hint_collection_plan_body = Показывает, какие моды будут установлены и включены при применении схемы.
mod_manager/hint_collection_json_title = Схема в JSON
mod_manager/hint_collection_json_body = Открывает текстовое представление схемы для просмотра и точного редактирования.
mod_manager/hint_collection_reset_title = Отменить изменения
mod_manager/hint_collection_reset_body = Возвращает последнюю сохранённую схему. Уже установленные моды не удаляются.
mod_manager/hint_collection_links_title = Связи на схеме
mod_manager/hint_collection_links_body = Показывает или скрывает линии зависимостей между группами и модами.
mod_manager/hint_load_order_title = Порядок загрузки
mod_manager/hint_load_order_body = Моды загружаются сверху вниз. Если два мода заменяют один ресурс, используется вариант нижнего мода.
mod_manager/sort_tooltip = Сортировка списка: по имени, автору или состоянию установки.
mod_manager/filters_reset_tooltip = Вернуть все фильтры и поле поиска к значениям по умолчанию.
mod_manager/collection_json_tooltip = Открыть схему как чистый JSON: посмотреть, отредактировать и применить обратно.
mod_manager/collection_reset_tooltip = Отменить все несохранённые изменения схемы.
mod_manager/collection_game_tooltip = Переключить редактируемую схему на другую коллекцию.
mod_manager/collection_plan_tooltip = Открыть план: что установит и включит применение схемы.
mod_manager/collection_problems_tooltip = Открыть список проблем: отсутствующие моды, версии и конфликты.

