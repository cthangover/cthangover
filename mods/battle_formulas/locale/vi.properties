mod_battle_formulas_name = Công thức chiến đấu
mod_battle_formulas_desc = Hành động chiến đấu là dữ liệu cho mọi lõi chiến đấu: một hành động có «Formula=a.mag * 3 - b.mdf + rand(0, 4)» không cần mã — sát thương hoặc hồi máu, giá mana (Cost=mp:5), xuyên khiên, gây trạng thái theo xác suất. a.* là người hành động, b.* là mục tiêu: chỉ số của họ cùng máu, tấn công, phòng thủ và điểm hiện tại. Cùng một kỹ năng chạy được cả trong trận kiểu FF lẫn trận bài. Kẻ địch có chỉ số lấy con số chiến đấu từ bảng của mình.
battle_formulas/schema/field/values = Giá trị
battle_formulas/schema/field/values_desc = Tham số của hành động; khóa mà lược đồ không biết được giữ nguyên
battle_formulas/schema/field/required_point = Điểm hành động
battle_formulas/schema/field/formula = Công thức
battle_formulas/schema/battle/formula_desc = a.* là người hành động, b.* là mục tiêu: a.atk * 2 - b.def + rand(0, 3)
battle_formulas/schema/field/effect = Hiệu ứng
battle_formulas/schema/field/cost = Chi phí
battle_formulas/schema/battle/cost_desc = Chi phí nguồn, ví dụ mp:4
battle_formulas/schema/field/pierce = Xuyên khiên
battle_formulas/schema/battle/pierce_desc = Sát thương bỏ qua khiên
battle_formulas/schema/field/state = Trạng thái
battle_formulas/schema/field/state_turns = Lượt trạng thái
battle_formulas/schema/field/state_chance = Tỉ lệ trạng thái, %
battle_formulas/schema/field/attack_factor = Hệ số tấn công
battle_formulas/schema/battle/attack_desc = Cho đòn thường của lõi: hệ số tấn công
battle_formulas/schema/field/attack_type = Loại tấn công
battle_formulas/schema/field/turn = Lượt
