mod_battle_formulas_name = 战斗公式
mod_battle_formulas_desc = 适用于任何战斗核心的数据化战斗动作：带有“Formula=a.mag * 3 - b.mdf + rand(0, 4)”的动作无需代码——伤害或治疗、法力消耗（Cost=mp:5）、穿透护盾、按几率施加状态。a.* 是行动者，b.* 是目标：他们的属性以及实时的生命、攻击、防御和行动点。同一个技能在 FF 风格战斗和卡牌战斗中都能用。带属性的敌人从自己的面板获得战斗数值。
battle_formulas/schema/field/values = 数值
battle_formulas/schema/field/values_desc = 动作的参数；模式不认识的键原样保留
battle_formulas/schema/field/required_point = 行动点
battle_formulas/schema/field/formula = 公式
battle_formulas/schema/battle/formula_desc = a.* 为行动者，b.* 为目标：a.atk * 2 - b.def + rand(0, 3)
battle_formulas/schema/field/effect = 效果
battle_formulas/schema/field/cost = 消耗
battle_formulas/schema/battle/cost_desc = 储备消耗，例如 mp:4
battle_formulas/schema/field/pierce = 穿透
battle_formulas/schema/battle/pierce_desc = 伤害无视护盾
battle_formulas/schema/field/state = 状态
battle_formulas/schema/field/state_turns = 状态回合
battle_formulas/schema/field/state_chance = 状态几率 %
battle_formulas/schema/field/attack_factor = 攻击倍率
battle_formulas/schema/battle/attack_desc = 用于核心的普通攻击：攻击倍率
battle_formulas/schema/field/attack_type = 攻击类型
battle_formulas/schema/field/turn = 回合
