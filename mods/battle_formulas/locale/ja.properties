battle_formulas/schema/field/values_desc = 行動のパラメーター。スキーマが知らないキーはそのまま残る
battle_formulas/schema/field/required_point = 行動ポイント
battle_formulas/schema/field/formula = 式
battle_formulas/schema/battle/formula_desc = a.* は行動する者、b.* は対象：a.atk * 2 - b.def + rand(0, 3)
