battle_formulas/schema/field/pierce = 貫通
battle_formulas/schema/battle/pierce_desc = ダメージがシールドを抜ける
battle_formulas/schema/field/state = 状態
battle_formulas/schema/field/state_turns = 状態ターン
battle_formulas/schema/field/state_chance = 状態の確率 %
battle_formulas/schema/field/attack_factor = 攻撃倍率
battle_formulas/schema/battle/attack_desc = コアの通常攻撃用：攻撃倍率
battle_formulas/schema/field/attack_type = 攻撃タイプ
