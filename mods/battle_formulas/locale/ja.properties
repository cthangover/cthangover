mod_battle_formulas_name = バトルの式
mod_battle_formulas_desc = どのバトルコアにも使えるデータとしてのバトル行動：「Formula=a.mag * 3 - b.mdf + rand(0, 4)」を持つ行動はコード不要——ダメージか回復、MP 消費（Cost=mp:5）、シールド貫通、確率付きの状態付与。a.* は行動する者、b.* は対象：そのステータスと現在の HP、攻撃、防御、ポイント。同じスキルが FF 風バトルでもカードバトルでも動く。ステータスを持つ敵はシートから戦闘値を得る。
