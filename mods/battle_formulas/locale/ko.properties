mod_battle_formulas_name = 전투 공식
mod_battle_formulas_desc = 모든 전투 코어에 쓰는 데이터 전투 행동: “Formula=a.mag * 3 - b.mdf + rand(0, 4)”를 가진 행동은 코드가 필요 없습니다 — 피해나 회복, 마나 비용(Cost=mp:5), 보호막 관통, 확률로 거는 상태. a.*는 행동하는 쪽, b.*는 대상: 그들의 능력치와 현재 체력, 공격, 방어, 포인트. 같은 스킬이 FF 스타일 전투와 카드 전투 모두에서 작동합니다. 능력치가 있는 적은 시트에서 전투 수치를 받습니다.
battle_formulas/schema/field/values = 값
battle_formulas/schema/field/values_desc = 행동의 매개변수. 스키마가 모르는 키는 그대로 유지
battle_formulas/schema/field/required_point = 행동 포인트
battle_formulas/schema/field/formula = 공식
battle_formulas/schema/battle/formula_desc = a.*는 행동하는 쪽, b.*는 대상: a.atk * 2 - b.def + rand(0, 3)
battle_formulas/schema/field/effect = 효과
battle_formulas/schema/field/cost = 비용
battle_formulas/schema/battle/cost_desc = 비축 비용. 예: mp:4
battle_formulas/schema/field/pierce = 관통
battle_formulas/schema/battle/pierce_desc = 피해가 보호막을 무시
battle_formulas/schema/field/state = 상태
battle_formulas/schema/field/state_turns = 상태 턴
battle_formulas/schema/field/state_chance = 상태 확률 %
battle_formulas/schema/field/attack_factor = 공격 배율
battle_formulas/schema/battle/attack_desc = 코어의 일반 공격용: 공격 배율
battle_formulas/schema/field/attack_type = 공격 유형
battle_formulas/schema/field/turn = 턴
