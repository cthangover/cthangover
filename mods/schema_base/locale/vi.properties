mod_schema_base_name = Lược đồ
mod_schema_base_desc = Chú thích dưới dạng dữ liệu: tệp schemas/*.json của mọi mod mô tả hành động và lệnh kịch bản (tham số, kiểu, tham chiếu thực thể) cùng các trường của loại thực thể — của mình hay của mod khác. Danh mục gộp chúng theo thứ tự tải, bộ kiểm tra soát giá trị, bộ viết tạo dòng kịch bản, chỉ mục biết id của mọi loại. Trình kiểm tra, các trình sửa dữ liệu và cửa sổ Trình sửa dữ liệu đều dựa trên nó.
