mod_schema_base_name = Схемы
mod_schema_base_desc = Аннотации как данные: файлы schemas/*.json любого мода описывают действия и команды сценариев (параметры, типы, ссылки на сущности) и поля видов сущностей — свои и чужие. Каталог сливает их по порядку загрузки, проверка сверяет значения, построитель пишет строки сценария, индекс знает id любого вида. На этом стоят валидатор, редакторы данных и окно «Редактор данных».
