mod_schema_base_name = Esquemas
mod_schema_base_desc = Anotaciones como datos: los archivos schemas/*.json de cualquier mod describen acciones y comandos de escenarios (parámetros, tipos, referencias a entidades) y los campos de los tipos de entidades, propios y ajenos. El catálogo los fusiona por orden de carga, el comprobador valida valores, el escritor arma líneas de escenario y el índice conoce los id de cualquier tipo. Sobre esto se apoyan el validador, los editores de datos y la ventana Editor de datos.
