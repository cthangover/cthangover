mod_interactive_base_name = Nền tảng tương tác
mod_interactive_base_desc = Hệ thống con đối tượng tương tác: các đối tượng tương tác trong cảnh định nghĩa bằng JSON (vùng rê chuột/nhấp, hiệu ứng làm nổi bật) với hành động nhấp bằng DSL/kịch bản, InteractiveManager và lớp dữ liệu của trình sửa tương tác.
