rpg_demo/chest/empty = 비어 있다. 이미 다 가져갔다.
rpg_demo/elder/quest_1 = "왔구나. 잘 들어라. 숲의 동굴 옆에 늑대가 자리를 잡았다. 염소를 물어 죽이고, 밤마다 울부짖고, 나를 이상하게 쳐다본다."
rpg_demo/elder/quest_2 = "동쪽으로 가거라, 연못을 지나 오솔길을 따라. 쫓아내 주면, 뭐 어쩔 수 없지, 더는 널 깨우지 않으마."
rpg_demo/elder/thanks_1 = "늑대가 사라졌다고? 이런, 이런. 널 믿지 않았는데 기어이 다 망쳐 놨구나."
rpg_demo/elder/thanks_2 = "어서 가 봐라. 이제 정오까지 자도 된다. 단 1분도 더는 안 돼."
rpg_demo/chest/forest = 숲속의 상자. 안에는 말린 버섯과 누군가의 잃어버린 희망. 버섯을 챙긴다.
rpg_demo/chest/house = 상자 안에는 낡은 양말과 '만지지 마시오'라고 쓴 쪽지. 이미 늦었다. 양말 밑에 동전 세 닢.
rpg_demo/door/locked = 잠겨 있다. 문 너머에서 누군가 아무도 없는 척하려고 무척 애쓰고 있다.
rpg_demo/merchant/line1 = "오, 손님이다! 엘릭서 신선해요, 앙금도 거의 없어요. 숲의 잡동사니도 가져와요, 전부 사들일게요. 뭐, 거의 전부."
rpg_demo/slime/line1 = 슬라임이 오솔길을 막고 도전적으로 꾸르륵거린다.
rpg_demo/sign/village = "동쪽: 잿빛 숲. 서쪽: 거기도 숲이지만 우리는 가지 않는다."
rpg_demo/villager/line1 = "숲에 슬라임이 있대. 작긴 한데 부츠 속에 기어들어 오면 짜증 나."
rpg_demo/wolf/line1 = 동굴 옆에 늑대가 앉아 있다. 촌장네 염소를 보는 눈빛으로 당신을 훑어본다.
rpg_demo/wolf/line2 = "크르르."
rpg_demo/house/enter = 집 안에서 약초와 밀랍 냄새, 그리고 촌장 냄새가 살짝 난다.
rpg_demo/forest/enter = 잿빛 숲. 누군가가 먹히고 있는 곳에서만 나는 고요함이다.
rpg_demo/intro/title = 잿빛 숲 옆 마을
rpg_demo/intro/line1 = 아침. 수탉들은 동트기 전에 목이 쉬었고, 촌장은 벌써 세 번이나 소년을 보내 당신을 불렀다.
rpg_demo/intro/controls = WASD 또는 방향키로 걷는다. E 또는 F로 말하고, 열고, 읽는다.
rpg_demo/pickup/branches = 마른 땔감 한 아름. 마을 상인이 받아 줄 것이다. 그는 뭐든 산다.
rpg_demo/pickup/stones = 매끈한 돌 몇 개. 쓸모없다, 그러니까 팔 물건이다.
rpg_demo/pickup/mushroom = 단단한 숲 버섯. 먹으면 기운이 날 것이다.
