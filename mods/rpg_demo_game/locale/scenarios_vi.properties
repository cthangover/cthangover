rpg_demo/chest/empty = Trống không. Bạn đã lấy hết rồi.
rpg_demo/elder/quest_1 = "Cậu đến rồi à. Nghe đây: có một con sói đã làm ổ bên hang trong rừng. Nó giết dê, đêm thì tru, lại còn nhìn ta rất lạ."
rpg_demo/elder/quest_2 = "Đi về phía đông, qua cái ao, theo con đường mòn. Đuổi nó đi, rồi thì thôi, ta sẽ thôi đánh thức cậu."
rpg_demo/elder/thanks_1 = "Con sói đi rồi à? Chà, chà. Ta chẳng tin cậu, thế mà cậu lại làm hỏng mất."
rpg_demo/elder/thanks_2 = "Đi đi. Giờ cậu có thể ngủ đến trưa. Không thêm một phút nào."
rpg_demo/chest/forest = Một cái rương trong rừng. Bên trong: nấm khô và niềm hy vọng đã mất của ai đó. Bạn lấy nấm.
rpg_demo/chest/house = Trong rương: tất cũ và một mẩu giấy ghi "Đừng động vào". Muộn rồi. Dưới đống tất: ba đồng xu.
rpg_demo/door/locked = Đã khóa. Sau cánh cửa có ai đó đang rất cố giả vờ là không có ai ở nhà.
rpg_demo/merchant/line1 = "Ồ, có khách! Thuốc tiên mới, hầu như không cặn. Mang cả đồ bỏ đi trong rừng tới đây, tôi mua hết. Ờ, gần như hết."
rpg_demo/slime/line1 = Một con slime chắn lối và kêu ọc ọc đầy thách thức.
rpg_demo/sign/village = "Phía đông: Rừng Xám. Phía tây: cũng là rừng, nhưng chúng ta không đi đến đó."
rpg_demo/villager/line1 = "Người ta bảo trong rừng có slime. Bé thôi, nhưng chui vào ủng thì bực lắm."
rpg_demo/wolf/line1 = Một con sói ngồi bên hang. Nó nhìn bạn từ đầu đến chân như nhìn đàn dê của trưởng làng.
rpg_demo/wolf/line2 = "Grừ."
rpg_demo/house/enter = Ngôi nhà thoang thoảng mùi thảo mộc, sáp ong và một chút mùi trưởng làng.
rpg_demo/forest/enter = Rừng Xám. Ở đây yên tĩnh theo cái kiểu chỉ có ở nơi ai đó đang bị ăn thịt.
rpg_demo/intro/title = Ngôi làng bên Rừng Xám
rpg_demo/intro/line1 = Buổi sáng. Lũ gà trống đã khản giọng từ trước bình minh, còn trưởng làng đã sai thằng bé đi gọi bạn ba lần.
rpg_demo/intro/controls = Di chuyển bằng WASD hoặc phím mũi tên. Nói chuyện, mở và đọc bằng E hoặc F.
rpg_demo/pickup/branches = Một ôm củi khô. Thương nhân trong làng sẽ nhận, ông ta mua mọi thứ.
rpg_demo/pickup/stones = Vài viên đá nhẵn. Vô dụng, nghĩa là bán được.
rpg_demo/pickup/mushroom = Một cây nấm rừng chắc nịch. Ăn vào sẽ thấy khỏe hơn.
