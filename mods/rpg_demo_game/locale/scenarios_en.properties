rpg_demo/chest/empty = Empty. You already took everything.
rpg_demo/elder/quest_1 = "So you came. Listen: a wolf has settled by the cave in the forest. Kills goats, howls at night, looks at me funny."
rpg_demo/elder/quest_2 = "Go east, past the pond, along the path. Drive it off, and so be it, I will stop waking you up."
rpg_demo/elder/thanks_1 = "The wolf is gone? Well, well. I did not believe in you, and you went and ruined it."
rpg_demo/elder/thanks_2 = "Off you go. Now you may sleep till noon. Not a minute longer."
rpg_demo/chest/forest = A chest in the forest. Inside: dried mushrooms and someone's lost hope. You take the mushrooms.
rpg_demo/chest/house = In the chest: old socks and a note saying "Don't touch". Too late. Under the socks: three coins.
rpg_demo/door/locked = Locked. Behind the door someone is trying very hard to pretend nobody is home.
rpg_demo/merchant/line1 = "Oh, a customer! Elixirs, fresh, hardly any sediment. And bring me the junk from the forest, I take everything. Well, almost."
rpg_demo/slime/line1 = A slime blocks the path and gurgles defiantly.
rpg_demo/sign/village = "East: the Grey Forest. West: also a forest, but we don't go there."
rpg_demo/villager/line1 = "They say there are slimes in the forest. Small ones, but it's insulting when they crawl into your boot."
rpg_demo/wolf/line1 = A wolf sits by the cave. It looks you over the way it looks at the elder's goats.
rpg_demo/wolf/line2 = "Grrr."
rpg_demo/house/enter = The house smells of herbs, wax and, a little, of the elder.
rpg_demo/forest/enter = The Grey Forest. It is quiet the way it is only quiet where someone is being eaten.
rpg_demo/intro/title = The Village by the Grey Forest
rpg_demo/intro/line1 = Morning. The roosters went hoarse before dawn, and the elder has already sent the boy for you three times.
rpg_demo/intro/controls = Walk with WASD or the arrows. Talk, open and read with E or F.
rpg_demo/pickup/branches = An armful of dry brushwood. The merchant in the village will take it, he takes everything.
rpg_demo/pickup/stones = A couple of smooth stones. Useless, which means they are for sale.
rpg_demo/pickup/mushroom = A firm forest mushroom. Eat it and you will feel better.
