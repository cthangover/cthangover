rpg_demo/chest/empty = Vacío. Ya te lo llevaste todo.
rpg_demo/elder/quest_1 = "Así que has venido. Escucha: un lobo se ha instalado junto a la cueva del bosque. Mata cabras, aúlla de noche y me mira raro."
rpg_demo/elder/quest_2 = "Ve al este, pasado el estanque, por el sendero. Échalo y, qué remedio, dejaré de despertarte."
rpg_demo/elder/thanks_1 = "¿Ya no está el lobo? Vaya, vaya. No creía en ti, y vas tú y lo estropeas."
rpg_demo/elder/thanks_2 = "Anda, vete. Ahora puedes dormir hasta mediodía. Ni un minuto más."
rpg_demo/chest/forest = Un cofre en el bosque. Dentro: setas secas y la esperanza perdida de alguien. Te llevas las setas.
rpg_demo/chest/house = En el cofre: calcetines viejos y una nota que dice "No tocar". Demasiado tarde. Debajo de los calcetines: tres monedas.
rpg_demo/door/locked = Cerrado. Tras la puerta alguien se esfuerza mucho en fingir que no hay nadie en casa.
rpg_demo/merchant/line1 = "¡Oh, un cliente! Elixires frescos, casi sin poso. Y tráeme la basura del bosque, lo compro todo. Bueno, casi."
rpg_demo/slime/line1 = Un limo bloquea el sendero y gorgotea desafiante.
rpg_demo/sign/village = "Al este: el Bosque Gris. Al oeste: también un bosque, pero allí no vamos."
rpg_demo/villager/line1 = "Dicen que en el bosque hay limos. Pequeños, pero fastidia cuando se te meten en la bota."
rpg_demo/wolf/line1 = Un lobo está sentado junto a la cueva. Te mira igual que mira a las cabras del anciano.
rpg_demo/wolf/line2 = "Grrr."
rpg_demo/house/enter = La casa huele a hierbas, a cera y, un poco, al anciano.
rpg_demo/forest/enter = El Bosque Gris. Está en silencio, como solo lo está donde se están comiendo a alguien.
rpg_demo/intro/title = La aldea junto al Bosque Gris
rpg_demo/intro/line1 = Mañana. Los gallos se quedaron roncos antes del alba, y el anciano ya ha mandado tres veces al chico a buscarte.
rpg_demo/intro/controls = Camina con WASD o las flechas. Habla, abre y lee con E o F.
rpg_demo/pickup/branches = Una brazada de leña seca. El mercader de la aldea la aceptará: él lo compra todo.
rpg_demo/pickup/stones = Un par de piedras lisas. No sirven para nada, así que se pueden vender.
rpg_demo/pickup/mushroom = Una seta firme del bosque. Cómetela y te sentirás mejor.
