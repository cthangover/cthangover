rpg_demo/chest/empty = Пусто. Ты уже всё забрал.
rpg_demo/elder/quest_1 = — Явился. Слушай: у пещеры в лесу поселился волк. Режет коз, воет по ночам, на меня смотрит косо.
rpg_demo/elder/quest_2 = — Иди на восток, мимо пруда, по тропе. Прогони его — и я, так и быть, перестану тебя будить.
rpg_demo/elder/thanks_1 = — Волка нет? Ну надо же. Я в тебя не верил, а ты взял и всё испортил.
rpg_demo/elder/thanks_2 = — Ступай. Теперь можешь спать до полудня. Не дольше.
rpg_demo/chest/forest = Сундук в лесу. Внутри — сухие грибы и чья-то потерянная надежда. Грибы ты берёшь.
rpg_demo/chest/house = В сундуке — старые носки и записка: «Не трогай». Поздно. Под носками — три монеты.
rpg_demo/door/locked = Заперто. За дверью кто-то очень старательно делает вид, что его нет.
rpg_demo/merchant/line1 = — О, покупатель! Эликсиры — свежие, почти без осадка. А хлам из леса — неси, всё возьму. Ну, почти всё.
rpg_demo/slime/line1 = Слизень перегородил тропу и булькает с вызовом.
rpg_demo/sign/village = «На восток — Серый лес. На запад — тоже лес, но мы туда не ходим».
rpg_demo/villager/line1 = — Говорят, в лесу слизни. Мелкие, а обидно, когда в сапог заползают.
rpg_demo/wolf/line1 = У пещеры сидит волк. Он оглядывает тебя, как старостину козу.
rpg_demo/wolf/line2 = — Р-р-р.
rpg_demo/house/enter = В доме пахнет травами, воском и немного — старостой.
rpg_demo/forest/enter = Серый лес. Здесь тихо так, как бывает тихо только там, где кого-то едят.
rpg_demo/intro/title = Деревня у Серого леса
rpg_demo/intro/line1 = Утро. Петухи охрипли ещё до рассвета, а староста уже трижды присылал за тобой мальчишку.
rpg_demo/intro/controls = Ходить — WASD или стрелки. Говорить, открывать, читать — E или F.
rpg_demo/pickup/branches = Охапка сухого хвороста. Торговцу в деревне сгодится — он всё берёт.
rpg_demo/pickup/stones = Пара гладких камней. Бесполезных, а значит — на продажу.
rpg_demo/pickup/mushroom = Крепкий лесной гриб. Съешь — и полегчает.
