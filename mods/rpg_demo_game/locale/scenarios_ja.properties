rpg_demo/chest/empty = 空っぽだ。もう全部持っていった。
rpg_demo/elder/quest_1 = 「来たか。いいか、森の洞窟のそばに狼が住みついた。ヤギを殺すし、夜は吠えるし、わしを妙な目で見る。」
rpg_demo/elder/quest_2 = 「東へ行け、池を過ぎて小道沿いにな。追い払ってくれたら、まあ仕方ない、もうお前を起こしに行くのはやめてやる。」
rpg_demo/elder/thanks_1 = 「狼がいなくなった？ ほう、ほう。お前のことなど信じておらんかったのに、台無しにしてくれおって。」
rpg_demo/elder/thanks_2 = 「さあ行け。これで昼まで寝ていいぞ。一分たりとも長くはならんがな。」
rpg_demo/chest/forest = 森の中の宝箱。中には干しキノコと、誰かの失われた希望。キノコをいただく。
rpg_demo/chest/house = 宝箱の中には古い靴下と「さわるな」と書かれたメモ。もう遅い。靴下の下には硬貨が 3 枚。
rpg_demo/door/locked = 鍵がかかっている。扉の向こうで誰かが、留守のふりを必死にしている。
rpg_demo/merchant/line1 = 「おや、お客さんだ！ エリクサーは新鮮、沈殿もほとんどなし。森のガラクタも持ってきな、何でも買い取るよ。まあ、ほとんど何でもね。」
rpg_demo/slime/line1 = スライムが小道をふさぎ、挑むようにごぼごぼ鳴っている。
rpg_demo/sign/village = 「東：灰色の森。西：こっちも森だが、そっちへは行かない。」
rpg_demo/villager/line1 = 「森にはスライムがいるらしい。小さいけど、ブーツに入り込まれると腹が立つんだ。」
rpg_demo/wolf/line1 = 洞窟のそばに狼が座っている。村長のヤギを見るような目つきで、こちらを値踏みしている。
rpg_demo/wolf/line2 = 「グルルル。」
rpg_demo/house/enter = 家の中は薬草と蝋と、少しだけ村長の匂いがする。
rpg_demo/forest/enter = 灰色の森。誰かが食べられている場所にしかない静けさだ。
rpg_demo/intro/title = 灰色の森のそばの村
rpg_demo/intro/line1 = 朝。ニワトリは夜明け前に声がかれ、村長はもう三度も少年をあなたを呼びによこした。
rpg_demo/intro/controls = WASD か矢印キーで歩く。E か F で話す、開ける、読む。
rpg_demo/pickup/branches = ひと抱えの乾いた柴。村の商人なら引き取ってくれる。何でも買う人だ。
rpg_demo/pickup/stones = すべすべした石がいくつか。役に立たない、つまり売り物だ。
rpg_demo/pickup/mushroom = しっかりした森のキノコ。食べれば元気になる。
