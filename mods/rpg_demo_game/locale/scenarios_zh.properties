rpg_demo/chest/empty = 空的。你已经全拿走了。
rpg_demo/elder/quest_1 = "你来了。听着：有只狼在森林的洞穴旁安了家。它咬死山羊，夜里嚎叫，还用奇怪的眼神看我。"
rpg_demo/elder/quest_2 = "往东走，经过池塘，沿着小路。把它赶走，那就算了，我不再叫你起床。"
rpg_demo/elder/thanks_1 = "狼没了？哎呀呀。我本来不信你，结果你还真给办砸了。"
rpg_demo/elder/thanks_2 = "去吧。现在你可以睡到中午了。一分钟也不许多。"
rpg_demo/chest/forest = 森林里的一个箱子。里面有干蘑菇和某人失落的希望。你拿走了蘑菇。
rpg_demo/chest/house = 箱子里：旧袜子和一张写着"别碰"的纸条。太迟了。袜子下面有三枚硬币。
rpg_demo/door/locked = 锁着。门后有人正拼命假装家里没人。
rpg_demo/merchant/line1 = "哦，来客人了！药剂新鲜，几乎没有沉淀。把森林里的破烂也带来，我全收。嗯，差不多全收。"
rpg_demo/slime/line1 = 一只史莱姆挡住了小路，挑衅地咕嘟作响。
rpg_demo/sign/village = "东边：灰森林。西边：也是森林，但我们不去那儿。"
rpg_demo/villager/line1 = "听说森林里有史莱姆。个头不大，可钻进靴子里可真气人。"
rpg_demo/wolf/line1 = 一只狼坐在洞穴旁。它打量你的眼神，就像打量村长的山羊。
rpg_demo/wolf/line2 = "嗷呜——"
rpg_demo/house/enter = 屋里有草药、蜡烛的味道，还有一点村长的味道。
rpg_demo/forest/enter = 灰森林。这里安静得只有正在吃掉某人的地方才会这样安静。
rpg_demo/intro/title = 灰森林旁的村庄
rpg_demo/intro/line1 = 早晨。公鸡在天亮前就叫哑了，村长已经派那个男孩来找你三次了。
rpg_demo/intro/controls = 用 WASD 或方向键行走。用 E 或 F 交谈、打开和阅读。
rpg_demo/pickup/branches = 一捆干柴。村里的商人会收的，他什么都收。
rpg_demo/pickup/stones = 几块光滑的石头。毫无用处，所以拿去卖。
rpg_demo/pickup/mushroom = 一朵结实的森林蘑菇。吃下去会舒服些。
