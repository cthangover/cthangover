mod_rpg_demo_game_name = RPG Demo
mod_rpg_demo_game_desc = RPG 데모의 콘텐츠: 마을, 촌장의 집, 동굴 옆에 늑대가 있는 숲. 맵, 이벤트, 시나리오만 있습니다.
rpg_demo/map/village = 잿빛 숲 옆 마을
rpg_demo/map/elder_house = 촌장의 집
rpg_demo/map/forest = 잿빛 숲
rpg_demo/character/hero = 영웅
rpg_demo/character/slime = 슬라임
rpg_demo/character/wolf = 늑대
rpg_demo/item/branches/name = 땔감
rpg_demo/item/branches/desc = 잿빛 숲의 마른 나뭇가지. 잡동사니지만 상인이 한 아름에 동전 하나를 쳐 준다.
rpg_demo/item/stones/name = 돌
rpg_demo/item/stones/desc = 숲의 매끈한 돌. 어째서인지 상인은 하나에 동전 두 닢에 사들인다.
rpg_demo/item/mushroom/name = 숲 버섯
rpg_demo/item/mushroom/desc = 먹을 수 있는 버섯. 체력을 5 회복한다.
rpg_demo/item/elixir/name = 엘릭서
rpg_demo/item/elixir/desc = 마을 상점에서 파는 붉은 치유 엘릭서. 체력을 20 회복한다.
rpg_demo/shop/village_merchant = 상인의 가게
