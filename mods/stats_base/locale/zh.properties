mod_stats_base_name = 属性
mod_stats_base_desc = 适用于任何类型的属性引擎：属性即数据（力量、魅力、生命、理智——没有内置列表），原型（RPG 职业或小说人物的性格）带有按等级的公式和经验曲线，特性——任何实体（物品、角色、状态）都能携带的修正。用于派生属性和战斗的公式、角色面板、由经验带来的等级。绑定的属性会写入战斗属性，因此任何战斗核心无需改动即可使用。
