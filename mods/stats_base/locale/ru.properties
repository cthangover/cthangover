mod_stats_base_name = Статы
mod_stats_base_desc = Движок статов для любого жанра: статы как данные (сила, харизма, здоровье, рассудок — встроенного списка нет), архетипы (классы RPG или характеры новеллы) с формулами по уровню и кривой опыта, черты — модификаторы, которые несёт любая сущность (предмет, персонаж, состояние). Формулы для производных статов и боя, лист персонажа, уровни из опыта. Привязанные статы пишутся в боевые атрибуты, поэтому любое боевое ядро работает с ними без изменений.
