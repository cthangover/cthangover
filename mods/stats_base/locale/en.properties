mod_stats_base_name = Stats
mod_stats_base_desc = A stats engine for any genre: stats as data (strength, charisma, health, sanity — there is no built-in list), archetypes (RPG classes or a novel's temperaments) with per-level formulas and an exp curve, traits — modifiers any entity may carry (an item, a character, a status). Formulas for derived stats and battles, a character sheet, levels from exp. Bound stats are written into the battle attributes, so every battle core uses them unchanged.
