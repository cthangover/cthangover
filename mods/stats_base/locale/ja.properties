mod_stats_base_name = ステータス
mod_stats_base_desc = どのジャンルにも使えるステータスエンジン：ステータスはデータ（筋力、カリスマ、HP、正気度——組み込みの一覧はない）、アーキタイプ（RPG の職業やノベルの気質）はレベルごとの式と経験値曲線を持ち、特性はどのエンティティ（アイテム、キャラクター、状態）にも付けられる修正。派生ステータスとバトルの式、キャラクターシート、経験値によるレベルアップ。結び付けたステータスはバトル属性に書き込まれるので、どのバトルコアもそのまま使える。
