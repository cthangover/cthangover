mod_stats_base_name = Chỉ số
mod_stats_base_desc = Bộ máy chỉ số cho mọi thể loại: chỉ số là dữ liệu (sức mạnh, sức hút, máu, lý trí — không có danh sách cố định), nguyên mẫu (lớp nhân vật RPG hay tính cách trong tiểu thuyết) có công thức theo cấp và đường kinh nghiệm, đặc tính — bộ điều chỉnh mà mọi thực thể (vật phẩm, nhân vật, trạng thái) đều mang được. Công thức cho chỉ số phái sinh và chiến đấu, bảng nhân vật, lên cấp nhờ kinh nghiệm. Chỉ số được gắn sẽ ghi vào thuộc tính chiến đấu, nên mọi lõi chiến đấu dùng được mà không cần sửa.
