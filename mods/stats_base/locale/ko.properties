mod_stats_base_name = 능력치
mod_stats_base_desc = 어떤 장르에도 쓰는 능력치 엔진: 데이터로 정의하는 능력치(힘, 매력, 체력, 정신력 — 내장 목록은 없음), 레벨별 공식과 경험치 곡선을 가진 원형(RPG 직업이나 노벨의 기질), 어떤 엔티티(아이템, 캐릭터, 상태)든 지닐 수 있는 수정치인 특성. 파생 능력치와 전투용 공식, 캐릭터 시트, 경험치로 오르는 레벨. 연결된 능력치는 전투 속성에 기록되므로 모든 전투 코어가 그대로 사용합니다.
