mod_stats_base_name = Estadísticas
mod_stats_base_desc = Un motor de estadísticas para cualquier género: estadísticas como datos (fuerza, carisma, salud, cordura — no hay lista fija), arquetipos (clases de RPG o temperamentos de una novela) con fórmulas por nivel y curva de experiencia, rasgos — modificadores que puede llevar cualquier entidad (un objeto, un personaje, un estado). Fórmulas para estadísticas derivadas y combates, hoja de personaje, niveles por experiencia. Las estadísticas vinculadas se escriben en los atributos de combate, así que cualquier núcleo de combate las usa sin cambios.
