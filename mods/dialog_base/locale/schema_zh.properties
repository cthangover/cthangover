dialog/schema/builtin/text = 台词
dialog/schema/builtin/text_desc = 一句对白；翻译键可选
dialog/schema/field/text = 文本
dialog/schema/field/locale_key = 翻译键
dialog/schema/builtin/ptext = 旁白
dialog/schema/builtin/ptext_desc = 旁白文本，会代入 ${var}
dialog/schema/builtin/flag = 剧情标记
dialog/schema/builtin/flag_desc = 会被保存的标记，条件据此触发
dialog/schema/field/flag = 标记
dialog/schema/field/value = 数值
dialog/schema/builtin/switch_scene = 切换场景
dialog/schema/builtin/switch_scene_desc = 小说场景或地图——地图也是场景
dialog/schema/field/scene = 场景
dialog/schema/builtin/goto = 跳到标签
dialog/schema/builtin/goto_desc = 无条件跳转
dialog/schema/field/label = 标签
dialog/schema/builtin/end = 结束对话
dialog/schema/builtin/end_desc = 关闭对话框
dialog/schema/checks/when = 如果——跳转
dialog/schema/checks/when_desc = 依据通用条件语言的条件跳转：标记、任务、属性、装备
dialog/schema/checks/arrow_true = 为真时跳转
dialog/schema/field/condition = 条件
dialog/schema/field/else = 否则跳转
dialog/schema/builtin/select = 选择
dialog/schema/builtin/select_desc = 回答前的问题；后面跟着 option 行
dialog/schema/builtin/option = 回答选项
dialog/schema/builtin/option_desc = 一个回答及其跳转标签；带条件时仅在条件成立时显示
dialog/schema/field/option_if = 显示条件
dialog/schema/builtin/option_if_desc = 例如 archetype(rogue) 或 "stat(cha) >= 5"；留空——总是显示
