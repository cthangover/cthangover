mod_characters_base_name = Motor de personajes
mod_characters_base_desc = Subsistema de personajes del motor: fábricas de personajes y de cartas de acción, la fábrica de avatares y la interfaz del panel de personajes. El núcleo resuelve las plantillas mediante los contratos ICharacterTemplateProvider/IActionTemplateProvider/IAvatarProvider.
characters/action/physics_attack/name = Ataque básico
characters/action/physics_attack/description = Ataca a un enemigo con un arma, con un multiplicador de daño de <g>1.0</g>
characters/action/defence/name = Defensa
characters/action/defence/description = Protege al objetivo con un multiplicador de defensa de <g>1.0</g>
characters/action/stun/name = Aturdir
characters/action/stun/description = Aturde al objetivo durante 2 turnos
