mod_classic_rpg_pack_name = 经典 RPG 包
mod_classic_rpg_pack_desc = 适用于任何游戏的现成经典奇幻规则，仅为数据：六项属性（力量、敏捷、智力、体力、魅力、幸运）和战斗属性（生命、法力、攻击、护甲、魔力），三个职业——战士、法师、盗贼——带按等级的成长和技能，装备栏位、八件装备和一瓶力量药剂，四个公式技能。小说可用魅力做检定，RPG 则全部都能用。
classic/stat/str = 力量
classic/stat/str_short = 力
classic/stat/str_desc = 出手多重、能举起多少。
classic/stat/agi = 敏捷
classic/stat/agi_short = 敏
classic/stat/agi_desc = 手快脚轻，出手精准。
classic/stat/int = 智力
classic/stat/int_short = 智
classic/stat/int_desc = 头脑、记忆与法力储量。
classic/stat/vit = 体力
classic/stat/vit_short = 体
classic/stat/vit_desc = 倒下之前能扛住多少。
classic/stat/cha = 魅力
classic/stat/cha_short = 魅
classic/stat/cha_desc = 说服、讨价还价和讨人喜欢的本事。
classic/stat/luk = 幸运
classic/stat/luk_short = 运
classic/stat/luk_desc = 别无他法时所指望的东西。
classic/stat/hp = 生命
classic/stat/hp_short = 命
classic/stat/hp_desc = 生命上限：随体力和等级增长。
classic/stat/mp = 法力
classic/stat/mp_short = 法
classic/stat/mp_desc = 施法所耗的储备，会消耗也会恢复。
classic/stat/atk = 攻击
classic/stat/atk_short = 攻
classic/stat/atk_desc = 战斗中普通一击的威力。
classic/stat/def = 护甲
classic/stat/def_short = 甲
classic/stat/def_desc = 开战时的护盾：吸收攻击直至耗尽。
classic/stat/mag = 魔力
classic/stat/mag_short = 魔
classic/stat/mag_desc = 法术的威力，无论火焰还是治愈。
classic/archetype/warrior = 战士
classic/archetype/warrior_desc = 结实直率：生命充沛，出手沉重，花招不多。
classic/archetype/mage = 法师
classic/archetype/mage_desc = 脆弱却危险：远处放火，为同伴疗伤。
classic/archetype/rogue = 盗贼
classic/archetype/rogue_desc = 灵巧又迷人：专打痛处，别人动手时他动嘴。
classic/slot/weapon = 武器
classic/slot/body = 身体
classic/slot/accessory = 饰品
classic/item/wood_sword/name = 木剑
classic/item/wood_sword/desc = 练习用的剑，留下的淤青比伤口多。攻击 +2。
classic/item/iron_sword/name = 铁剑
classic/item/iron_sword/desc = 朴素可靠的剑刃。战士和盗贼可用。攻击 +5。
classic/item/oak_staff/name = 橡木法杖
classic/item/oak_staff/desc = 杖头的水晶轻轻嗡鸣。仅限法师。魔力 +4，法力 +5。
classic/item/dagger/name = 匕首
classic/item/dagger/desc = 短小弯曲，随手可取。攻击 +3，敏捷 +2。
classic/item/leather_armor/name = 皮甲
classic/item/leather_armor/desc = 带着鞣革与旅途的气味。护甲 +2，生命 +6。
classic/item/robe/name = 长袍
classic/item/robe/desc = 镶金边的蓝布，穿上它思路更清晰。法力 +6，智力 +1。
classic/item/clover_charm/name = 四叶草护符
classic/item/clover_charm/desc = 绳上的四片小叶子，戴着无妨。幸运 +3。
classic/item/silver_ring/name = 银戒指
classic/item/silver_ring/desc = 镶着红宝石，人们看着它，顺便也听你说话。魅力 +2。
classic/item/strength_tonic/name = 力量药剂
classic/item/strength_tonic/desc = 苦得像真相。永久为饮用者的力量 +1。
classic/action/power_strike/name = 强力一击
classic/action/power_strike/desc = 全力挥击：一倍半攻击，再加些力量。
classic/action/fireball/name = 火球术
classic/action/fireball/desc = 4 法力。火焰无视护盾：两倍魔力再加一次掷骰。
classic/action/heal/name = 治愈
classic/action/heal/desc = 3 法力。愈合伤口：两倍魔力加四。
classic/action/guard_break/name = 破防
classic/action/guard_break/desc = 穿透护盾攻击，护盾越厚伤害越高；有时会眩晕。
