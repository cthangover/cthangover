mod_classic_rpg_pack_name = Paquete RPG clásico
mod_classic_rpg_pack_desc = Reglas clásicas de fantasía listas para cualquier juego, solo datos: seis atributos (fuerza, agilidad, inteligencia, vitalidad, carisma, suerte) y estadísticas de combate (salud, maná, ataque, armadura, magia), tres clases — guerrero, mago, pícaro — con crecimiento por nivel y habilidades, ranuras de equipo, ocho piezas de equipo y un tónico de fuerza, cuatro habilidades con fórmulas. Una novela puede usar el carisma para tiradas; un RPG, todo a la vez.
classic/stat/str = Fuerza
classic/stat/str_short = FUE
classic/stat/str_desc = Cuánto golpea y cuánto levanta.
classic/stat/agi = Agilidad
classic/stat/agi_short = AGI
classic/stat/agi_desc = Manos rápidas, pies ligeros, golpes precisos.
classic/stat/int = Inteligencia
classic/stat/int_short = INT
classic/stat/int_desc = Ingenio, memoria y reserva de maná.
classic/stat/vit = Vitalidad
classic/stat/vit_short = VIT
classic/stat/vit_desc = Cuánto se aguanta antes de caer.
classic/stat/cha = Carisma
classic/stat/cha_short = CAR
classic/stat/cha_desc = El don de convencer, regatear y caer bien.
classic/stat/luk = Suerte
classic/stat/luk_short = SUE
classic/stat/luk_desc = Aquello en lo que se confía cuando no queda nada más.
classic/stat/hp = Salud
classic/stat/hp_short = PS
classic/stat/hp_desc = Salud máxima: crece con la vitalidad y el nivel.
classic/stat/mp = Maná
classic/stat/mp_short = PM
classic/stat/mp_desc = La reserva de la que beben los hechizos; se gasta y se recupera.
classic/stat/atk = Ataque
classic/stat/atk_short = ATQ
classic/stat/atk_desc = La fuerza de un golpe normal en combate.
classic/stat/def = Armadura
classic/stat/def_short = DEF
classic/stat/def_desc = El escudo con el que se empieza el combate: absorbe golpes hasta agotarse.
classic/stat/mag = Magia
classic/stat/mag_short = MAG
classic/stat/mag_desc = El poder de los hechizos, de fuego y de curación por igual.
classic/archetype/warrior = Guerrero
classic/archetype/warrior_desc = Robusto y directo: mucha salud, un golpe pesado, pocos trucos.
classic/archetype/mage = Mago
classic/archetype/mage_desc = Frágil pero peligroso: fuego a distancia y curación para los suyos.
classic/archetype/rogue = Pícaro
classic/archetype/rogue_desc = Ágil y encantador: golpea donde duele y negocia donde otros pelean.
classic/slot/weapon = Arma
classic/slot/body = Cuerpo
classic/slot/accessory = Accesorio
classic/item/wood_sword/name = Espada de madera
classic/item/wood_sword/desc = Una espada de práctica. Deja más moratones que heridas. Ataque +2.
classic/item/iron_sword/name = Espada de hierro
classic/item/iron_sword/desc = Una hoja sencilla y honrada. Para guerreros y pícaros. Ataque +5.
classic/item/oak_staff/name = Bastón de roble
classic/item/oak_staff/desc = El cristal de la punta zumba en voz baja. Solo para magos. Magia +4, maná +5.
classic/item/dagger/name = Daga
classic/item/dagger/desc = Corta, curva, siempre a mano. Ataque +3, agilidad +2.
classic/item/leather_armor/name = Armadura de cuero
classic/item/leather_armor/desc = Huele a cuero curtido y a camino. Armadura +2, salud +6.
classic/item/robe/name = Túnica
classic/item/robe/desc = Tela azul con ribete dorado; con ella se piensa más claro. Maná +6, inteligencia +1.
classic/item/clover_charm/name = Amuleto de trébol
classic/item/clover_charm/desc = Cuatro hojitas en un cordón. No hace daño. Suerte +3.
classic/item/silver_ring/name = Anillo de plata
classic/item/silver_ring/desc = Con una piedra roja; la gente la mira y, de paso, escucha. Carisma +2.
classic/item/strength_tonic/name = Tónico de fuerza
classic/item/strength_tonic/desc = Amargo como la verdad. Suma 1 a la fuerza de quien lo bebe, para siempre.
classic/action/power_strike/name = Golpe poderoso
classic/action/power_strike/desc = Un golpe a fondo: ataque y medio y un poco más de la fuerza.
classic/action/fireball/name = Bola de fuego
classic/action/fireball/desc = 4 de maná. El fuego ignora escudos: el doble de magia más una tirada.
classic/action/heal/name = Curación
classic/action/heal/desc = 3 de maná. Cierra heridas: el doble de magia más cuatro.
classic/action/guard_break/name = Rompeguardia
classic/action/guard_break/desc = Golpea a través del escudo, más fuerte cuanto más grueso; a veces aturde.
