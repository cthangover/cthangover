mod_classic_rpg_pack_name = Классический RPG-пак
mod_classic_rpg_pack_desc = Готовые классические правила фэнтези для любой игры, только данные: шесть атрибутов (сила, ловкость, интеллект, выносливость, харизма, удача) и боевые статы (здоровье, мана, атака, броня, магия), три класса — воин, маг, плут — с ростом по уровням и навыками, слоты снаряжения, восемь вещей и тоник силы, четыре навыка на формулах. Новелле пригодится харизма для проверок, RPG — всё сразу.
classic/stat/str = Сила
classic/stat/str_short = СИЛ
classic/stat/str_desc = Насколько крепко бьёт и сколько поднимает.
classic/stat/agi = Ловкость
classic/stat/agi_short = ЛОВ
classic/stat/agi_desc = Быстрые руки, лёгкие ноги, точные удары.
classic/stat/int = Интеллект
classic/stat/int_short = ИНТ
classic/stat/int_desc = Ум, память и запас маны.
classic/stat/vit = Выносливость
classic/stat/vit_short = ВЫН
classic/stat/vit_desc = Сколько можно вынести до того, как упасть.
classic/stat/cha = Харизма
classic/stat/cha_short = ХАР
classic/stat/cha_desc = Умение убеждать, торговаться и нравиться.
classic/stat/luk = Удача
classic/stat/luk_short = УДЧ
classic/stat/luk_desc = То, на что надеются, когда больше не на что.
classic/stat/hp = Здоровье
classic/stat/hp_short = ЗДР
classic/stat/hp_desc = Наибольшее здоровье: растёт с выносливостью и уровнем.
classic/stat/mp = Мана
classic/stat/mp_short = МАН
classic/stat/mp_desc = Запас сил для заклинаний; тратится и восстанавливается.
classic/stat/atk = Атака
classic/stat/atk_short = АТК
classic/stat/atk_desc = Сила обычного удара в бою.
classic/stat/def = Броня
classic/stat/def_short = БРН
classic/stat/def_desc = Щит в начале боя: поглощает удары, пока не иссякнет.
classic/stat/mag = Магия
classic/stat/mag_short = МАГ
classic/stat/mag_desc = Сила заклинаний — и огня, и исцеления.
classic/archetype/warrior = Воин
classic/archetype/warrior_desc = Крепкий и прямой: много здоровья, тяжёлый удар, мало хитростей.
classic/archetype/mage = Маг
classic/archetype/mage_desc = Хрупкий, но опасный: огонь на расстоянии и исцеление для своих.
classic/archetype/rogue = Плут
classic/archetype/rogue_desc = Ловкий и обаятельный: бьёт туда, где больно, и договаривается там, где другие дерутся.
classic/slot/weapon = Оружие
classic/slot/body = Тело
classic/slot/accessory = Украшение
classic/item/wood_sword/name = Деревянный меч
classic/item/wood_sword/desc = Учебный меч. Синяков от него больше, чем ран. Атака +2.
classic/item/iron_sword/name = Железный меч
classic/item/iron_sword/desc = Простой и честный клинок. Воинам и плутам. Атака +5.
classic/item/oak_staff/name = Дубовый посох
classic/item/oak_staff/desc = Кристалл в навершии тихо гудит. Только магам. Магия +4, мана +5.
classic/item/dagger/name = Кинжал
classic/item/dagger/desc = Короткий, кривой, всегда под рукой. Атака +3, ловкость +2.
classic/item/leather_armor/name = Кожаная куртка
classic/item/leather_armor/desc = Пахнет дублёной кожей и дорогой. Броня +2, здоровье +6.
classic/item/robe/name = Мантия
classic/item/robe/desc = Синяя ткань с золотой каймой; в ней думается яснее. Мана +6, интеллект +1.
classic/item/clover_charm/name = Клеверный оберег
classic/item/clover_charm/desc = Четыре листика на шнурке. Не помешает. Удача +3.
classic/item/silver_ring/name = Серебряное кольцо
classic/item/silver_ring/desc = С красным камнем; на него смотрят, а заодно и слушают. Харизма +2.
classic/item/strength_tonic/name = Тоник силы
classic/item/strength_tonic/desc = Горький, как правда. Навсегда добавляет 1 к силе того, кто выпьет.
classic/action/power_strike/name = Мощный удар
classic/action/power_strike/desc = Удар с замахом: полторы атаки и ещё немного от силы.
classic/action/fireball/name = Огненный шар
classic/action/fireball/desc = 4 маны. Пламя не замечает щитов: двойная магия плюс бросок кубика.
classic/action/heal/name = Исцеление
classic/action/heal/desc = 3 маны. Затягивает раны: двойная магия плюс четыре.
classic/action/guard_break/name = Пролом защиты
classic/action/guard_break/desc = Бьёт сквозь щит, и тем сильнее, чем он толще; иногда оглушает.
