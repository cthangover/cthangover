mod_classic_rpg_pack_name = 클래식 RPG 팩
mod_classic_rpg_pack_desc = 어떤 게임에도 쓰는 기성 클래식 판타지 규칙, 데이터만: 여섯 능력치(힘, 민첩, 지능, 체력, 매력, 행운)와 전투 능력치(체력, 마나, 공격, 방어구, 마력), 레벨별 성장과 스킬을 가진 세 직업 — 전사, 마법사, 도적, 장비 슬롯, 장비 여덟 개와 힘의 강장제, 공식으로 동작하는 스킬 네 개. 노벨은 판정에 매력을, RPG는 전부를 쓸 수 있습니다.
classic/stat/str = 힘
classic/stat/str_short = 힘
classic/stat/str_desc = 얼마나 세게 치고 얼마나 들어 올리는지.
classic/stat/agi = 민첩
classic/stat/agi_short = 민첩
classic/stat/agi_desc = 빠른 손, 가벼운 발, 정확한 일격.
classic/stat/int = 지능
classic/stat/int_short = 지능
classic/stat/int_desc = 지혜, 기억력, 그리고 마나의 양.
classic/stat/vit = 체력
classic/stat/vit_short = 체력
classic/stat/vit_desc = 쓰러지기 전까지 얼마나 버티는지.
classic/stat/cha = 매력
classic/stat/cha_short = 매력
classic/stat/cha_desc = 설득하고 흥정하고 호감을 사는 재주.
classic/stat/luk = 행운
classic/stat/luk_short = 행운
classic/stat/luk_desc = 달리 기댈 것이 없을 때 기대는 것.
classic/stat/hp = 체력치
classic/stat/hp_short = HP
classic/stat/hp_desc = 최대 체력: 체력과 레벨에 따라 늘어납니다.
classic/stat/mp = 마나
classic/stat/mp_short = MP
classic/stat/mp_desc = 주문이 끌어 쓰는 비축량. 쓰고 회복합니다.
classic/stat/atk = 공격
classic/stat/atk_short = 공격
classic/stat/atk_desc = 전투에서 평범한 일격의 위력.
classic/stat/def = 방어구
classic/stat/def_short = 방어
classic/stat/def_desc = 전투 시작 때의 보호막: 다 닳을 때까지 공격을 흡수합니다.
classic/stat/mag = 마력
classic/stat/mag_short = 마력
classic/stat/mag_desc = 주문의 위력. 불길이든 치유든.
classic/archetype/warrior = 전사
classic/archetype/warrior_desc = 튼튼하고 우직함: 체력이 많고 일격이 무겁지만 잔꾀는 적습니다.
classic/archetype/mage = 마법사
classic/archetype/mage_desc = 약하지만 위험함: 멀리서 불을 쏘고 동료를 치유합니다.
classic/archetype/rogue = 도적
classic/archetype/rogue_desc = 날렵하고 매력적: 아픈 곳을 찌르고, 남들이 싸울 때 말로 풀어냅니다.
classic/slot/weapon = 무기
classic/slot/body = 몸
classic/slot/accessory = 장신구
classic/item/wood_sword/name = 나무 검
classic/item/wood_sword/desc = 연습용 검. 상처보다 멍을 더 남깁니다. 공격 +2.
classic/item/iron_sword/name = 철검
classic/item/iron_sword/desc = 소박하고 정직한 칼날. 전사와 도적용. 공격 +5.
classic/item/oak_staff/name = 참나무 지팡이
classic/item/oak_staff/desc = 꼭대기의 수정이 조용히 웁니다. 마법사 전용. 마력 +4, 마나 +5.
classic/item/dagger/name = 단검
classic/item/dagger/desc = 짧고 휘었으며 늘 손 닿는 곳에. 공격 +3, 민첩 +2.
classic/item/leather_armor/name = 가죽 갑옷
classic/item/leather_armor/desc = 무두질한 가죽과 길 냄새가 납니다. 방어구 +2, 체력 +6.
classic/item/robe/name = 로브
classic/item/robe/desc = 금빛 테두리의 푸른 천. 입으면 생각이 맑아집니다. 마나 +6, 지능 +1.
classic/item/clover_charm/name = 클로버 부적
classic/item/clover_charm/desc = 끈에 꿴 네 잎. 손해 볼 건 없죠. 행운 +3.
classic/item/silver_ring/name = 은반지
classic/item/silver_ring/desc = 붉은 보석이 박혀 있어 사람들이 보다가 말도 듣게 됩니다. 매력 +2.
classic/item/strength_tonic/name = 힘의 강장제
classic/item/strength_tonic/desc = 진실처럼 씁니다. 마신 이의 힘을 영구히 1 올립니다.
classic/action/power_strike/name = 강타
classic/action/power_strike/desc = 크게 휘두르기: 공격의 1.5배에 힘만큼 조금 더.
classic/action/fireball/name = 화염구
classic/action/fireball/desc = 마나 4. 불은 보호막을 무시: 마력의 두 배에 주사위 한 번.
classic/action/heal/name = 치유
classic/action/heal/desc = 마나 3. 상처를 아물게 합니다: 마력의 두 배에 넷.
classic/action/guard_break/name = 가드 브레이크
classic/action/guard_break/desc = 보호막을 뚫고 칩니다. 두꺼울수록 더 세게. 가끔 기절시킵니다.
