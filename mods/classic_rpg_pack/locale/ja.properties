mod_classic_rpg_pack_name = クラシック RPG パック
mod_classic_rpg_pack_desc = どのゲームにも使える既製のクラシックなファンタジールール、データのみ：六つの能力値（筋力、敏捷、知力、体力、カリスマ、運）と戦闘ステータス（HP、MP、攻撃、防具、魔力）、三つの職業——戦士、魔法使い、盗賊——とレベルごとの成長とスキル、装備スロット、八つの装備と力の強壮剤、式で動く四つのスキル。ノベルなら判定にカリスマを、RPG なら全部を使える。
classic/stat/str = 筋力
classic/stat/str_short = 筋
classic/stat/str_desc = どれだけ強く打ち、どれだけ持ち上げられるか。
classic/stat/agi = 敏捷
classic/stat/agi_short = 敏
classic/stat/agi_desc = 素早い手、軽い足、正確な一撃。
classic/stat/int = 知力
classic/stat/int_short = 知
classic/stat/int_desc = 頭の回転、記憶、そして MP の量。
classic/stat/vit = 体力
classic/stat/vit_short = 体
classic/stat/vit_desc = 倒れるまでにどれだけ耐えられるか。
classic/stat/cha = カリスマ
classic/stat/cha_short = 魅
classic/stat/cha_desc = 説得し、値切り、好かれる才覚。
classic/stat/luk = 運
classic/stat/luk_short = 運
classic/stat/luk_desc = 他に頼るものがないときに頼るもの。
classic/stat/hp = HP
classic/stat/hp_short = HP
classic/stat/hp_desc = 最大 HP：体力とレベルで増える。
classic/stat/mp = MP
classic/stat/mp_short = MP
classic/stat/mp_desc = 呪文が使う蓄え。消費し、回復する。
classic/stat/atk = 攻撃
classic/stat/atk_short = 攻
classic/stat/atk_desc = 戦闘での通常攻撃の威力。
classic/stat/def = 防具
classic/stat/def_short = 防
classic/stat/def_desc = 戦闘開始時のシールド：尽きるまで攻撃を吸収する。
classic/stat/mag = 魔力
classic/stat/mag_short = 魔
classic/stat/mag_desc = 呪文の威力。炎にも癒やしにも。
classic/archetype/warrior = 戦士
classic/archetype/warrior_desc = 頑丈で真っ直ぐ：HP が多く、一撃が重く、小技は少ない。
classic/archetype/mage = 魔法使い
classic/archetype/mage_desc = もろいが危険：遠くから炎を放ち、仲間を癒やす。
classic/archetype/rogue = 盗賊
classic/archetype/rogue_desc = 身軽で人たらし：急所を突き、他人が戦う場面で話をつける。
classic/slot/weapon = 武器
classic/slot/body = 体
classic/slot/accessory = アクセサリー
classic/item/wood_sword/name = 木の剣
classic/item/wood_sword/desc = 練習用の剣。傷より痣のほうが多く残る。攻撃 +2。
classic/item/iron_sword/name = 鉄の剣
classic/item/iron_sword/desc = 質素で実直な刃。戦士と盗賊向け。攻撃 +5。
classic/item/oak_staff/name = 樫の杖
classic/item/oak_staff/desc = 先端の水晶が静かに唸る。魔法使い専用。魔力 +4、MP +5。
classic/item/dagger/name = 短剣
classic/item/dagger/desc = 短く、反っていて、いつも手元にある。攻撃 +3、敏捷 +2。
classic/item/leather_armor/name = 革の鎧
classic/item/leather_armor/desc = なめし革と旅路の匂い。防具 +2、HP +6。
classic/item/robe/name = ローブ
classic/item/robe/desc = 金の縁取りの青い布。着ると頭が冴える。MP +6、知力 +1。
classic/item/clover_charm/name = クローバーのお守り
classic/item/clover_charm/desc = 紐に通した四枚の小さな葉。損はない。運 +3。
classic/item/silver_ring/name = 銀の指輪
classic/item/silver_ring/desc = 赤い石付き。人はそれを見て、ついでに話を聞く。カリスマ +2。
classic/item/strength_tonic/name = 力の強壮剤
classic/item/strength_tonic/desc = 真実のように苦い。飲んだ者の筋力を永久に 1 上げる。
classic/action/power_strike/name = パワーストライク
classic/action/power_strike/desc = 大振りの一撃：攻撃の 1.5 倍に筋力の上乗せ。
classic/action/fireball/name = ファイアボール
classic/action/fireball/desc = MP 4。炎はシールドを無視：魔力の 2 倍にダイス一つ。
classic/action/heal/name = ヒール
classic/action/heal/desc = MP 3。傷をふさぐ：魔力の 2 倍に 4。
classic/action/guard_break/name = ガードブレイク
classic/action/guard_break/desc = シールドを貫いて打つ。厚いほど強い。時々気絶させる。
