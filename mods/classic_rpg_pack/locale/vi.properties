mod_classic_rpg_pack_name = Gói RPG cổ điển
mod_classic_rpg_pack_desc = Bộ luật giả tưởng cổ điển dùng ngay cho mọi game, chỉ là dữ liệu: sáu thuộc tính (sức mạnh, nhanh nhẹn, trí tuệ, thể lực, sức hút, may mắn) và chỉ số chiến đấu (máu, mana, tấn công, giáp, phép), ba lớp — chiến binh, pháp sư, đạo tặc — có tăng trưởng theo cấp và kỹ năng, ô trang bị, tám món đồ và một bình thuốc sức mạnh, bốn kỹ năng theo công thức. Tiểu thuyết dùng sức hút để kiểm tra, RPG dùng tất cả.
classic/stat/str = Sức mạnh
classic/stat/str_short = SMA
classic/stat/str_desc = Đánh mạnh đến đâu và nhấc được bao nhiêu.
classic/stat/agi = Nhanh nhẹn
classic/stat/agi_short = NHA
classic/stat/agi_desc = Tay nhanh, chân nhẹ, đòn chính xác.
classic/stat/int = Trí tuệ
classic/stat/int_short = TRI
classic/stat/int_desc = Trí óc, trí nhớ và lượng mana.
classic/stat/vit = Thể lực
classic/stat/vit_short = THE
classic/stat/vit_desc = Chịu được bao nhiêu trước khi gục ngã.
classic/stat/cha = Sức hút
classic/stat/cha_short = HUT
classic/stat/cha_desc = Tài thuyết phục, mặc cả và được lòng người.
classic/stat/luk = May mắn
classic/stat/luk_short = MAY
classic/stat/luk_desc = Thứ người ta trông vào khi chẳng còn gì khác.
classic/stat/hp = Máu
classic/stat/hp_short = HP
classic/stat/hp_desc = Máu tối đa: tăng theo thể lực và cấp.
classic/stat/mp = Mana
classic/stat/mp_short = MP
classic/stat/mp_desc = Nguồn sức cho phép thuật; tiêu hao và hồi lại.
classic/stat/atk = Tấn công
classic/stat/atk_short = TC
classic/stat/atk_desc = Sức mạnh của một đòn thường trong trận.
classic/stat/def = Giáp
classic/stat/def_short = GIAP
classic/stat/def_desc = Khiên lúc vào trận: đỡ đòn cho đến khi cạn.
classic/stat/mag = Phép thuật
classic/stat/mag_short = PHEP
classic/stat/mag_desc = Sức mạnh phép thuật, cả lửa lẫn chữa lành.
classic/archetype/warrior = Chiến binh
classic/archetype/warrior_desc = Rắn rỏi và thẳng thắn: nhiều máu, đòn nặng, ít mánh khóe.
classic/archetype/mage = Pháp sư
classic/archetype/mage_desc = Mong manh nhưng nguy hiểm: lửa từ xa và chữa lành cho đồng đội.
classic/archetype/rogue = Đạo tặc
classic/archetype/rogue_desc = Nhanh nhẹn và duyên dáng: đánh vào chỗ hiểm, thương lượng nơi kẻ khác đánh nhau.
classic/slot/weapon = Vũ khí
classic/slot/body = Thân
classic/slot/accessory = Phụ kiện
classic/item/wood_sword/name = Kiếm gỗ
classic/item/wood_sword/desc = Kiếm tập. Để lại vết bầm nhiều hơn vết thương. Tấn công +2.
classic/item/iron_sword/name = Kiếm sắt
classic/item/iron_sword/desc = Lưỡi kiếm đơn giản, chân thật. Dành cho chiến binh và đạo tặc. Tấn công +5.
classic/item/oak_staff/name = Gậy gỗ sồi
classic/item/oak_staff/desc = Viên pha lê trên đỉnh khẽ ngân. Chỉ dành cho pháp sư. Phép +4, mana +5.
classic/item/dagger/name = Dao găm
classic/item/dagger/desc = Ngắn, cong, luôn sẵn trong tay. Tấn công +3, nhanh nhẹn +2.
classic/item/leather_armor/name = Giáp da
classic/item/leather_armor/desc = Mùi da thuộc và đường xa. Giáp +2, máu +6.
classic/item/robe/name = Áo choàng
classic/item/robe/desc = Vải xanh viền vàng; mặc vào nghĩ sáng suốt hơn. Mana +6, trí tuệ +1.
classic/item/clover_charm/name = Bùa cỏ bốn lá
classic/item/clover_charm/desc = Bốn chiếc lá nhỏ trên sợi dây. Chẳng hại gì. May mắn +3.
classic/item/silver_ring/name = Nhẫn bạc
classic/item/silver_ring/desc = Có viên đá đỏ; người ta nhìn nó, và tiện thể lắng nghe. Sức hút +2.
classic/item/strength_tonic/name = Thuốc sức mạnh
classic/item/strength_tonic/desc = Đắng như sự thật. Tăng vĩnh viễn 1 sức mạnh cho người uống.
classic/action/power_strike/name = Đòn mạnh
classic/action/power_strike/desc = Một nhát vung hết sức: gấp rưỡi tấn công và thêm chút từ sức mạnh.
classic/action/fireball/name = Quả cầu lửa
classic/action/fireball/desc = 4 mana. Lửa bỏ qua khiên: gấp đôi phép cộng một lần tung xúc xắc.
classic/action/heal/name = Chữa lành
classic/action/heal/desc = 3 mana. Khép miệng vết thương: gấp đôi phép cộng bốn.
classic/action/guard_break/name = Phá thế thủ
classic/action/guard_break/desc = Đánh xuyên khiên, khiên càng dày càng đau; đôi khi gây choáng.
