mod_classic_rpg_pack_name = Classic RPG Pack
mod_classic_rpg_pack_desc = Ready-made classic fantasy rules for any game, data only: six attributes (strength, agility, intelligence, vitality, charisma, luck) and combat stats (health, mana, attack, armour, magic), three classes — warrior, mage, rogue — with growth by level and skills, equipment slots, eight pieces of gear and a strength tonic, four formula skills. A novel can use charisma for checks, an RPG everything at once.
classic/stat/str = Strength
classic/stat/str_short = STR
classic/stat/str_desc = How hard one hits and how much one lifts.
classic/stat/agi = Agility
classic/stat/agi_short = AGI
classic/stat/agi_desc = Quick hands, light feet, precise blows.
classic/stat/int = Intelligence
classic/stat/int_short = INT
classic/stat/int_desc = Wits, memory and the depth of one's mana.
classic/stat/vit = Vitality
classic/stat/vit_short = VIT
classic/stat/vit_desc = How much one can take before falling.
classic/stat/cha = Charisma
classic/stat/cha_short = CHA
classic/stat/cha_desc = The knack of persuading, bargaining and being liked.
classic/stat/luk = Luck
classic/stat/luk_short = LUK
classic/stat/luk_desc = What one counts on when there is nothing else.
classic/stat/hp = Health
classic/stat/hp_short = HP
classic/stat/hp_desc = Maximum health: grows with vitality and level.
classic/stat/mp = Mana
classic/stat/mp_short = MP
classic/stat/mp_desc = The reserve spells draw on; spent and restored.
classic/stat/atk = Attack
classic/stat/atk_short = ATK
classic/stat/atk_desc = The strength of a plain blow in battle.
classic/stat/def = Armour
classic/stat/def_short = DEF
classic/stat/def_desc = The shield one starts a battle with: it soaks up blows until it is spent.
classic/stat/mag = Magic
classic/stat/mag_short = MAG
classic/stat/mag_desc = The power of spells, of fire and of healing alike.
classic/archetype/warrior = Warrior
classic/archetype/warrior_desc = Sturdy and straightforward: plenty of health, a heavy blow, few tricks.
classic/archetype/mage = Mage
classic/archetype/mage_desc = Fragile but dangerous: fire from afar and healing for friends.
classic/archetype/rogue = Rogue
classic/archetype/rogue_desc = Nimble and charming: strikes where it hurts and talks where others fight.
classic/slot/weapon = Weapon
classic/slot/body = Body
classic/slot/accessory = Accessory
classic/item/wood_sword/name = Wooden sword
classic/item/wood_sword/desc = A training sword. It leaves more bruises than wounds. Attack +2.
classic/item/iron_sword/name = Iron sword
classic/item/iron_sword/desc = A plain, honest blade. For warriors and rogues. Attack +5.
classic/item/oak_staff/name = Oak staff
classic/item/oak_staff/desc = The crystal on top hums quietly. Mages only. Magic +4, mana +5.
classic/item/dagger/name = Dagger
classic/item/dagger/desc = Short, curved, always at hand. Attack +3, agility +2.
classic/item/leather_armor/name = Leather armour
classic/item/leather_armor/desc = Smells of tanned hide and the road. Armour +2, health +6.
classic/item/robe/name = Robe
classic/item/robe/desc = Blue cloth with golden trim; one thinks more clearly in it. Mana +6, intelligence +1.
classic/item/clover_charm/name = Clover charm
classic/item/clover_charm/desc = Four little leaves on a cord. It can't hurt. Luck +3.
classic/item/silver_ring/name = Silver ring
classic/item/silver_ring/desc = With a red stone; people look at it, and listen while they do. Charisma +2.
classic/item/strength_tonic/name = Strength tonic
classic/item/strength_tonic/desc = Bitter as the truth. Adds 1 to the drinker's strength for good.
classic/action/power_strike/name = Power strike
classic/action/power_strike/desc = A full swing: one and a half times the attack and a bit more from strength.
classic/action/fireball/name = Fireball
classic/action/fireball/desc = 4 mana. Fire ignores shields: twice the magic plus a die roll.
classic/action/heal/name = Heal
classic/action/heal/desc = 3 mana. Closes wounds: twice the magic plus four.
classic/action/guard_break/name = Guard break
classic/action/guard_break/desc = Strikes through the shield, the harder the thicker it is; sometimes stuns.
