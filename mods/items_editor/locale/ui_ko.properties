mod_items_editor_name = 아이템 에디터
mod_items_editor_desc = 게임 아이템 에디터: 검색과 그림이 있는 목록, 모드의 모든 언어로 된 이름과 설명, 가격, 아이콘, 유형, 사용 액션. 저장하면 게임에 바로 보입니다.
tools/items_editor/title = 아이템
tools/items_editor/name = 이름
tools/items_editor/description = 설명
tools/items_editor/cost = 가격
tools/items_editor/cost_tip = 동전 단위 가격. 거래와 상점에서 쓰인다
tools/items_editor/sprite = 아이콘
tools/items_editor/sprite_tip = 모드의 items/ 폴더에 있는 그림. 인벤토리, 거래, RPG 맵에 놓인 아이템에 표시된다
tools/items_editor/type = 유형
tools/items_editor/type_tip = Quest — 퀘스트 아이템, Used — 사용 가능, TargetUsed — 캐릭터에게 사용, Food — 음식, Resource — 자원, Recipe — 레시피, CantDrop — 버릴 수 없음
tools/items_editor/action = 액션
tools/items_editor/action_tip = 사용했을 때의 효과. null — 없음. 액션의 매개변수(예: heal)는 '기타 필드'에 있다
