mod_items_editor_name = 物品编辑器
mod_items_editor_desc = 游戏物品的编辑器：带搜索和图片的列表，模组每种语言的名称和描述，价格、图标、类型和使用动作；保存后游戏中立即可见。
tools/items_editor/title = 物品
tools/items_editor/name = 名称
tools/items_editor/description = 描述
tools/items_editor/cost = 价格
tools/items_editor/cost_tip = 以金币计的价格；交易和商店会用到
tools/items_editor/sprite = 图标
tools/items_editor/sprite_tip = 模组 items/ 文件夹中的图片：背包、交易以及放在 RPG 地图上的物品都会显示它
tools/items_editor/type = 类型
tools/items_editor/type_tip = Quest——任务物品，Used——可使用，TargetUsed——对角色使用，Food——食物，Resource——资源，Recipe——配方，CantDrop——不可丢弃
tools/items_editor/action = 动作
tools/items_editor/action_tip = 使用时的效果；null——无。动作的参数（例如 heal）在"其他字段"中
